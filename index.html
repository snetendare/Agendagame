<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1315">
<title>Agenda</title>
<style>
:root { --bg: #0D1315; }
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
#world { position: fixed; inset: 0; }
#world canvas { display: block; }
</style>
</head>
<body>
<div id="world"></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
// ===== 3D camera and its controls =====
// Taken from No Mans Land (src/camera3d.js) on 2026-11-03. Changes here: opts.home is the view the camera starts in
// and goes back to (Esc, a tap in a cinematic view); Agenda uses 1, the tilted view. opts.farTop replaces the enemy
// tower's height in the tilted fit.
// Camera3D(THREE, camera, el, opts) drives a THREE.PerspectiveCamera over the board from pointer, wheel and key input
// on the element el.
//
// Views: level 0 is the strategic view, straight down at the whole board (taps there go to opts.onTap as a ground
// point, so the game can place squads). There the page can also take a one-finger drag for itself (to move a squad):
// opts.onPress(point) on the press returns true to take it, then opts.onDrag(point) as it moves and opts.onDrop(point)
// when it lifts (null when a second finger or a cancel ends it); a short press still counts as a tap after the drop.
// onTap and onPress also get the screen point (clientX, clientY), and groundAt(clientX, clientY, h) finds where it
// meets a level h metres above the ground (to pick what stands there).
// A mouse moving over the strategic view with no button down goes to opts.onHover(point), null when it leaves.
// While opts.placing() is true (the player is deploying), the angled view takes taps, drags and hover the same way;
// a drag that the page doesn't take still looks around, and setLevel(k) (or a pinch, the wheel, Esc) changes view.
// Level 1 is the tilted view: most of the board from your side at TILT degrees, gentler than the angled view; it works
// like the strategic view (taps and drags go to the page, nothing to pan), but it can be rotated round the middle of the
// board: twist two fingers (or right/middle drag, Q/E). The turn carries on into the views further in and goes when
// the camera is back at the strategic view. Levels 2 and 3 are cinematic: angled, then
// close to the ground. In a cinematic view you can only look around: drag to move, twist (or right/middle drag, Q/E) to rotate, and a tap
// goes back to the strategic view.
// Every step in goes the same way: Strategic -> Tilted -> Angled -> Ground.
//   Touch: spread two fingers to go in, pinch to come back out. The camera follows the fingers, then settles on the
//          nearest level when they lift.
//   Mouse: the wheel steps a level in or out; a touchpad pinch (ctrl + wheel) works like the fingers.
//
// focus(k, x, z): the battle cam. While the strategic or tilted view is up, k from 0 to 1 moves it closer, lower and onto the
// ground point (x, z), easing in and back out on its own.
//
// opts.onInput() on every pointer, wheel and key event and when the camera starts gliding to a level (setLevel too),
// and busy() while it moves on its own, so a page that only draws when something changes knows when to draw.
// zoom() is where the gestures are: 0 strategic, 1 tilted, 2 angled, 3 ground (the level numbers), fractional in between.
// dispose() when the page is done with it.
//
// The ground is the plane y = 0, the board is opts.width x opts.depth metres centred on the origin, and the player's
// own side is toward +z (the bottom of the screen in the strategic view).
const Camera3D = (THREE, camera, el, opts) => {
  const W = opts.width, D = opts.depth;
  const FOV = camera.fov;
  // the levels: pitch (degrees above the horizon) and distance from the point looked at (metres)
  const LEVELS = [null, null, { pitch: 26, dist: 80 }, { pitch: 20, dist: 24 }]; // strategic and tilted fit the board; angled: low, far back to see the enemy side
  const MAX = LEVELS.length - 1;
  const TAP_MOVE = 10, TAP_MS = 350;   // a touch that moves less than this many px and lifts this fast is a tap
  const PINCH_DEAD = Math.log(1.06);   // the fingers must spread or close by 6% before the view zooms
  const TWIST_DEAD = 10 * Math.PI / 180; // and twist by 10 degrees before it rotates
  const PINCH_PER_LEVEL = Math.log(2.1); // spreading the fingers 2.1x apart goes in one level
  const PAN_SPEED = 2;                 // a drag moves the view this many times as far as the finger
  const TILT = 50;                     // pitch of the tilted view (degrees above the horizon)
  const TILT_IN = 1;                   // the tilted view sits this much closer than a fit of the whole board (below 1 the far corners may leave the screen)
  const TILT_IN_PC = 1;                 // the same on a PC (a wide window beside the panel)
  const FAR_TOP = opts.farTop ?? 13;   // the tilted fit also keeps this height above the far edge on screen (NML: the enemy tower, its flag and health bar)
  const HOME = opts.home || 0;         // the standard view: where the camera starts and goes back to
  const FOCUS = { pitch: 58, dist: 0.6 }; // the battle cam at full strength: at most this pitch, this much of the view's distance

  // zoom along the gestures: 0 strategic, 1 tilted, 2 angled, 3 ground (fractional while pinching or settling)
  const ZMIN = 0, ZMAX = MAX;
  let z = HOME;
  let target = new THREE.Vector3(); // the point a cinematic view looks at (on the ground)
  let yaw = 0;                // rotation of the tilted and cinematic views around the vertical axis (radians, 0 = from your side)
  let settle = null;          // { from, to, t } while z glides to a level
  let aspect = 1, viewH = 1;
  let tilt = { pitch: TILT, dist: 100, tz: 0 }; // the tilted view: distance and look point that fit the board (fitTilted)
  const foc = { k: 0, x: 0, z: 0 }, focT = { k: 0, x: 0, z: 0 }; // the battle cam now, and where it's heading
  const woke = () => { if (opts.onInput) opts.onInput(); };
  const clampTarget = () => {
    target.x = Math.max(-W / 2 - 4, Math.min(W / 2 + 4, target.x));
    target.z = Math.max(-D / 2 - 4, Math.min(D / 2 + 4, target.z));
  };
  // the strategic view: straight down from high enough to fit the whole board
  const strategicDist = () => {
    const tan = Math.tan(FOV * Math.PI / 360);
    return Math.max(D / 2 / tan, W / 2 / (tan * aspect)) * 1.03;
  };
  // the tilted view: the distance, and the look point (z) that centres the board on the screen, so all four
  // corners (and models standing on them) fit
  const probe = new THREE.PerspectiveCamera(FOV, 1, 1, 1000), corner = new THREE.Vector3();
  function fitTilted() {
    const p = TILT * Math.PI / 180;
    probe.aspect = aspect; probe.updateProjectionMatrix();
    const ext = (d, tz) => {
      probe.position.set(0, Math.sin(p) * d, tz + Math.cos(p) * d); probe.lookAt(0, 0, tz); probe.updateMatrixWorld();
      let x = 0, y0 = Infinity, y1 = -Infinity;
      const pts = [];
      for (const cx of [-W / 2, W / 2]) for (const cz of [-D / 2, D / 2]) for (const h of [0, 2.5]) pts.push([cx, h, cz]);
      for (const cx of [-W / 4, 0, W / 4]) pts.push([cx, FAR_TOP, -D / 2]); // the enemy tower's top, flag and health bar
      for (const [cx, h, cz] of pts) {
        corner.set(cx, h, cz).project(probe);
        x = Math.max(x, Math.abs(corner.x)); y0 = Math.min(y0, corner.y); y1 = Math.max(y1, corner.y);
      }
      return { x, y0, y1 };
    };
    const centre = (d) => { // the board's middle on the screen rises as the look point comes toward you
      let lo = -D, hi = D;
      for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2, e = ext(d, mid); if (e.y0 + e.y1 > 0) hi = mid; else lo = mid; }
      return (lo + hi) / 2;
    };
    let lo = 10, hi = 600;
    for (let i = 0; i < 30; i++) {
      const d = (lo + hi) / 2, e = ext(d, centre(d));
      if (e.x <= 0.97 && (e.y1 - e.y0) / 2 <= 0.97) hi = d; else lo = d;
    }
    const tin = document.documentElement.classList.contains('pc') ? TILT_IN_PC : TILT_IN;
    tilt = { pitch: TILT, dist: hi * tin, tz: centre(hi * tin) };
  }
  // pitch and distance for any zoom value, gliding between levels (distance on a log scale, so it feels even)
  function pose(zz) {
    // on a screen taller than the 12:16 board, the cinematic views step back so they still see as far to the sides
    const lv = (u) => u === 0 ? { pitch: 90, dist: strategicDist() } : u === 1 ? { pitch: tilt.pitch, dist: tilt.dist } : { pitch: LEVELS[u].pitch, dist: LEVELS[u].dist * Math.max(1, 0.75 / aspect) };
    const k = Math.max(ZMIN, Math.min(ZMAX - 1, Math.floor(zz))), f = zz - k, a = lv(k), b = lv(k + 1);
    return { pitch: a.pitch + (b.pitch - a.pitch) * f, dist: Math.exp(Math.log(a.dist) + (Math.log(b.dist) - Math.log(a.dist)) * f) };
  }
  function apply() {
    let { pitch, dist } = pose(z);
    // strategic to tilted, the look point slides to the tilted one and the turn grows from none (the tilted view turns
    // round the middle of the board, its look point with it); from tilted in to angled, the look point slides on to
    // the cinematic one
    const s1 = Math.max(0, Math.min(1, z)), w = Math.max(0, Math.min(1, z - 1)), yw = yaw * s1, z0 = tilt.tz * s1;
    const lx = Math.sin(yw) * z0, lz = Math.cos(yw) * z0;
    let tx = lx + (target.x - lx) * w, tz = lz + (target.z - lz) * w;
    // the battle cam, on the strategic and tilted views only (it fades as the player goes in)
    const fk = foc.k * (1 - w);
    if (fk > 0) {
      pitch += (Math.min(pitch, FOCUS.pitch) - pitch) * fk; dist *= Math.pow(FOCUS.dist, fk);
      tx += (foc.x - tx) * fk; tz += (foc.z - tz) * fk;
    }
    const p = pitch * Math.PI / 180, h = Math.cos(p) * dist;
    camera.position.set(tx + Math.sin(yw) * h, Math.sin(p) * dist, tz + Math.cos(yw) * h);
    camera.up.set(-Math.sin(yw), 0, -Math.cos(yw)); // "up" on the screen points away from the camera, so straight down works too
    camera.lookAt(tx, 0, tz);
    camera.updateProjectionMatrix();
  }
  const level = () => Math.round(z);
  const strategic = () => Math.abs(z) < 0.01 && !settle;
  // the views where taps, drags and hover go to the page: strategic, tilted, and angled while the player is placing
  const handsOn = () => strategic() || (!settle && (Math.abs(z - 1) < 0.01 || (Math.abs(z - 2) < 0.01 && !!(opts.placing && opts.placing()))));
  const cinematic = () => z > 1.01; // in from the tilted view: the look point and turn count
  const turnable = () => z > 0.7; // the tilted view and further in can be rotated
  function settleTo(to) {
    to = Math.max(ZMIN, Math.min(ZMAX, to));
    settle = { from: z, to, t: 0 };
    if (opts.onLevel) opts.onLevel(to);
    woke();
  }
  // the nearest level when the fingers lift; it takes a fair push to leave the strategic view
  const nearest = () => z < 0.35 ? 0 : Math.min(ZMAX, Math.max(1, Math.round(z)));
  function goStrategic() { settleTo(0); }
  function goHome() { settleTo(HOME); }

  // the point on the ground under a screen point (null if it's above the horizon)
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  // the point under a screen point on the ground, or (h metres) on a level that high above it
  const level_ = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function groundAt(cx, cy, h = 0) {
    const r = el.getBoundingClientRect();
    ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = new THREE.Vector3();
    if (!h) return ray.ray.intersectPlane(ground, hit);
    level_.constant = -h;
    const p = ray.ray.intersectPlane(level_, hit);
    if (p) p.y = 0;
    return p;
  }
  // a cinematic view, when it comes, looks at the ground under a screen point
  function aimAt(cx, cy) {
    const g = groundAt(cx, cy);
    if (g) { target.set(g.x, 0, g.z); clampTarget(); }
    if (z < 0.5) yaw = 0; // from the tilted view the turn stays
  }
  // move the look point so the ground follows a drag of dx, dy px
  function pan(dx, dy) {
    const { pitch, dist } = pose(z), k = PAN_SPEED * 2 * dist * Math.tan(FOV * Math.PI / 360) / viewH;
    const s = Math.sin(pitch * Math.PI / 180);
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    target.x += -rx * dx * k + fx * dy * k / s;
    target.z += -rz * dx * k + fz * dy * k / s;
    clampTarget();
  }

  // ---------- pointers: one finger or the left button pans or taps, two fingers pinch and twist ----------
  const pts = new Map();      // pointerId -> { x, y }
  let tap = null;             // a press that may still turn out to be a tap
  let two = null;             // the two-finger gesture under way
  let rotDrag = null;         // a right / middle button drag that rotates
  let grab = null;            // pointerId of a one-finger drag the page took (opts.onPress)
  function dropGrab(p) { if (grab == null) return; grab = null; if (opts.onDrop) opts.onDrop(p); }
  const pair = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(b.x - a.x, b.y - a.y), ang: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };
  function startTwo() {
    const p = pair();
    settle = null;
    dropGrab(null);
    if (!cinematic()) aimAt(p.mx, p.my);
    if (Math.abs(z - Math.round(z)) < 0.01) z = Math.round(z);
    two = { d0: p.d, a0: p.ang, z0: z, yaw0: yaw, mx: p.mx, my: p.my, zooming: false, turning: false };
    tap = null;
  }
  el.addEventListener('pointerdown', (e) => {
    woke();
    if (e.pointerType === 'mouse' && e.button !== 0) {
      e.preventDefault();
      if (turnable()) rotDrag = { x: e.clientX };
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    if (pts.size === 1) {
      tap = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      if (handsOn() && opts.onPress && opts.onPress(groundAt(e.clientX, e.clientY), e.clientX, e.clientY)) grab = e.pointerId;
    }
    else if (pts.size === 2) startTwo();
  });
  el.addEventListener('pointermove', (e) => {
    woke();
    if (rotDrag) { yaw -= (e.clientX - rotDrag.x) * 0.008; rotDrag.x = e.clientX; return; }
    const p0 = pts.get(e.pointerId);
    if (!p0) { if (e.pointerType === 'mouse' && !e.buttons && handsOn() && opts.onHover) opts.onHover(groundAt(e.clientX, e.clientY)); return; }
    const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
    p0.x = e.clientX; p0.y = e.clientY;
    if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > TAP_MOVE) tap = null;
    if (grab === e.pointerId) { if (opts.onDrag) opts.onDrag(groundAt(e.clientX, e.clientY)); return; }
    if (pts.size === 1 && !tap && cinematic()) pan(dx, dy);
    if (pts.size === 2 && two) {
      const p = pair(), s = Math.log(p.d / two.d0), turn = Math.atan2(Math.sin(p.ang - two.a0), Math.cos(p.ang - two.a0));
      if (!two.zooming && Math.abs(s) > PINCH_DEAD) { two.zooming = true; two.sOff = Math.sign(s) * PINCH_DEAD; }
      if (!two.turning && Math.abs(turn) > TWIST_DEAD && turnable()) { two.turning = true; two.aOff = Math.sign(turn) * TWIST_DEAD; }
      if (two.zooming) z = Math.max(ZMIN, Math.min(ZMAX, two.z0 + (s - two.sOff) / PINCH_PER_LEVEL));
      if (two.turning) yaw = two.yaw0 + (turn - two.aOff); // the view turns the way the fingers twist
      if (z > 1.3) pan(p.mx - two.mx, p.my - two.my); // the two fingers moving together drag the view too
      two.mx = p.mx; two.my = p.my;
    }
  });
  function lift(e) {
    woke();
    if (rotDrag && e.pointerType === 'mouse' && e.button !== 0) { rotDrag = null; return; }
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (grab === e.pointerId) dropGrab(e.type === 'pointerup' ? groundAt(e.clientX, e.clientY) : null);
    if (tap && tap.id === e.pointerId && e.type === 'pointerup' && performance.now() - tap.t < TAP_MS) {
      swallow = { x: e.clientX, y: e.clientY, t: performance.now() };
      if (handsOn()) { if (opts.onTap) opts.onTap(groundAt(e.clientX, e.clientY), e.clientX, e.clientY); }
      else goHome();
    }
    tap = null;
    if (two && pts.size < 2) { two = null; settleTo(nearest()); }
  }
  // the click the browser sends after a tap: the tap was taken on the lift, so whatever it opened (a sheet over the
  // board) must not get that click too, or it lands on the sheet's backdrop and closes it, or on one of its buttons
  let swallow = null;
  function swallowClick(e) {
    if (swallow && performance.now() - swallow.t < 700 && Math.hypot(e.clientX - swallow.x, e.clientY - swallow.y) < 30) { e.stopPropagation(); e.preventDefault(); }
    swallow = null;
  }
  window.addEventListener('click', swallowClick, true);
  el.addEventListener('pointerup', lift);
  el.addEventListener('pointercancel', lift);
  el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && opts.onHover) opts.onHover(null); });
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- wheel: a notch steps a level (toward the pointer from the strategic view); ctrl + wheel is a touchpad pinch ----------
  let wheelAcc = 0, wheelBlock = 0, pinchIdle = 0;
  el.addEventListener('wheel', (e) => {
    e.preventDefault(); woke();
    const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    if (e.ctrlKey) { // touchpad pinch
      settle = null;
      if (!cinematic() && dy < 0) aimAt(e.clientX, e.clientY);
      z = Math.max(ZMIN, Math.min(ZMAX, z - dy * 0.012));
      clearTimeout(pinchIdle); pinchIdle = setTimeout(() => settleTo(nearest()), 220);
      return;
    }
    const now = performance.now();
    if (now < wheelBlock) return; // touchpads send a stream of small scrolls: one step per gesture
    wheelAcc += dy;
    if (Math.abs(wheelAcc) < 40) return;
    const to = Math.round(z) + (wheelAcc < 0 ? 1 : -1);
    wheelAcc = 0; wheelBlock = now + 260;
    if (to < ZMIN || to > ZMAX) return;
    if (!cinematic() && to === 2) aimAt(e.clientX, e.clientY);
    settleTo(to);
  }, { passive: false });

  // ---------- keys: Q / E rotate, Escape goes back to the strategic view ----------
  const keys = new Set();
  const keyDown = (e) => { woke(); keys.add(e.key.toLowerCase()); if (e.key === 'Escape') goHome(); };
  const keyUp = (e) => keys.delete(e.key.toLowerCase());
  window.addEventListener('keydown', keyDown);
  window.addEventListener('keyup', keyUp);
  // the page is done with this camera: let go of the window's keys (the element's listeners go with the element)
  function dispose() { window.removeEventListener('click', swallowClick, true); window.removeEventListener('keydown', keyDown); window.removeEventListener('keyup', keyUp); keys.clear(); }

  function update(dt) {
    if (settle) {
      settle.t = Math.min(1, settle.t + dt / 0.3);
      const e = 1 - Math.pow(1 - settle.t, 3); // ease out
      z = settle.from + (settle.to - settle.from) * e;
      if (settle.t >= 1) { z = settle.to; settle = null; if (z < 0.5) yaw = 0; }
    }
    if (foc.k !== focT.k) {
      foc.k += (focT.k - foc.k) * Math.min(1, dt * 3);
      if (Math.abs(foc.k - focT.k) < 0.002) foc.k = focT.k;
    }
    if (focT.k > 0) { foc.x = focT.x; foc.z = focT.z; }
    if (turnable() && !settle) { if (keys.has('q')) yaw += dt * 1.6; if (keys.has('e')) yaw -= dt * 1.6; }
    apply();
  }
  // go to a level; into the angled view from the strategic or tilted one, it looks at your own half of the board
  // (the half nearest the camera, when the tilted view was turned)
  function setLevel(k) {
    if (k > 1 && !cinematic()) { if (z < 0.5) yaw = 0; target.set(Math.sin(yaw) * D / 4, 0, Math.cos(yaw) * D / 4); }
    settleTo(k);
  }
  function resize(width, height) { aspect = width / height; viewH = height; camera.aspect = aspect; fitTilted(); apply(); }
  // the battle cam (see the top); x, z on the ground
  function focus(k, x = 0, zz = 0) {
    if (k > 0 && foc.k === 0) { foc.x = x; foc.z = zz; }
    focT.k = Math.max(0, Math.min(1, k)); focT.x = x; focT.z = zz;
  }

  // moving on its own (gliding to a level, a gesture under way, a rotate key held), so the page should keep drawing
  const busy = () => !!settle || !!two || !!rotDrag || keys.has('q') || keys.has('e') || foc.k !== focT.k;
  return { update, resize, groundAt, goStrategic, goHome, setLevel, strategic, handsOn, level, busy, dispose, zoom: () => z, LEVELS: MAX + 1, focus };
};

// ===== The painted floor: No Mans Land's meadow, with darker grid lines and no zones =====
// Floor.paint(cols, rows, tilePx) -> a canvas with the board's ground painted on it: patches of dusty green, grass
// strokes and the grid between tiles. Seeded, so it looks the same every time.
// Taken from No Mans Land (src/floors.js, the meadow look, and the 3D board's grid from src/render2d.js) on 2026-11-03,
// without the zones and no man's land.
const Floor = (() => {
  const MEADOW = { base: '#5F714C', patch: ['#6A7D53', '#556944', '#718156', '#506343'], strokes: ['#76895C', '#485B3C'] };
  const GRID = 'rgba(20, 28, 16, 0.22)';
  function paint(cols, rows, t) {
    const W = cols * t, H = rows * t, L = MEADOW;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    let sd = 99991; const rr = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; };
    c.fillStyle = L.base; c.fillRect(0, 0, W, H);
    const blob = (x, y, rx, ry, col, a) => { const g = c.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry)); g.addColorStop(0, col); g.addColorStop(1, col + '00');
      c.globalAlpha = a; c.fillStyle = g; c.beginPath(); c.ellipse(x, y, rx, ry, rr() * 3, 0, Math.PI * 2); c.fill(); };
    // NML paints 70 patches on its 12 x 16 board: the same density here
    const patches = Math.round(70 * cols * rows / 192);
    for (let k = 0; k < patches; k++) blob(rr() * W, rr() * H, t * (0.8 + rr() * 2.2), t * (0.6 + rr() * 1.6), L.patch[k % 4], 0.55);
    c.lineCap = 'round';
    for (let k = 0; k < cols * rows * 14; k++) { // painted grass strokes
      const x = rr() * W, y = rr() * H, l = t * (0.06 + rr() * 0.1);

    const id = b.id || 'standard', look = b.look || 'meadow', COLS = b.cols, ROWS = b.rows;
    const k = [id, look, COLS, ROWS, castShadows].join('|');
    if (k === key) return;
    key = k; clear();
    const bi = biomeOf(look);
    // seeded per map, not per side: both players get the same land, each seeing it from their own end
    let sd = 0; for (const ch of id) sd = (sd * 31 + ch.charCodeAt(0)) % 2147483647; sd = sd || 7;
    const rr = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; };
    const pickOf = (list) => { let s = 0; for (const [, w] of list) s += w; let x = rr() * s; for (const [n, w] of list) { if ((x -= w) <= 0) return n; } return list[0][0]; };
    const hw = BW / 2, hd = BD / 2;
    // model (+ '~' when far out: no shadow, an impostor if it has one; bushes from 6 m) -> [[x, y, z, ang, s, shade]]
    const placed = new Map();
    // ponds (the desert's oasis): nothing else grows in the water
    const ponds = bi.ponds ? [{ x: hw * 0.2, z: -hd - 25, rx: 24, rz: 12 }, { x: -hw - 17, z: -hd * 0.25, rx: 9, rz: 16 }] : [];
    const inPond = (x, z, k = 1.12) => ponds.some((p) => ((x - p.x) / p.rx) ** 2 + ((z - p.z) / p.rz) ** 2 < k * k);
    const tintFor = (name) => { const t = (bi.tints || []).find(([re]) => re.test(name)); return t ? t[1] : [1, 1, 1]; };
    const put = (name, x, z, s, y = 0, wet = false) => {
      if (!lib[name] || (!wet && inPond(x, z))) return;
      const d = outside(x, z), k = name + (d > 16 || (d > 6 && /^Bush/.test(name)) ? '~' : ''), sh = 0.85 + rr() * 0.3, t = tintFor(name);
      (placed.get(k) || placed.set(k, []).get(k)).push([x, y, z, rr() * Math.PI * 2, s, [bi.tint[0] * t[0] * sh, bi.tint[1] * t[1] * sh, bi.tint[2] * t[2] * sh]]);
    };
    const L = bi.low === 'desert' ? DESERT : bi.low === 'autumn' ? AUTUMN : bi.low === 'rocks' ? { low: ROCKS, tuft: PEBBLES, rocks: ROCKS, dress: DRESS } : { low: LOW, tuft: TUFT, rocks: ROCKS, dress: DRESS };
    const low = () => pickOf(L.low), tuft = () => pickOf(L.tuft);
    const outside = (x, z) => Math.max(Math.abs(x) - hw, Math.abs(z) - hd, 0) > 0 ? Math.hypot(Math.max(0, Math.abs(x) - hw), Math.max(0, Math.abs(z) - hd)) : 0;
    // 1. the edge: a frame of bushes, rocks and tall grass hugging the board, so its edge doesn't end in a hard line
    for (let s = 0; s < 2 * (BW + BD); s += 2.6) {
      if (rr() > 0.8 * bi.grow) continue;
      let x, z; const off = 0.8 + rr() * 2.8;
      if (s < BW) { x = -hw + s; z = -hd - off; } else if (s < BW + BD) { x = hw + off; z = -hd + (s - BW); }
      else if (s < 2 * BW + BD) { x = hw - (s - BW - BD); z = hd + off; } else { x = -hw - off; z = hd - (s - 2 * BW - BD); }
      const near = z > hd; // your end: keep it low so it never hides your own squads from the angled view
      put(low(), x, z, (near ? 0.8 : 1) * (1 + rr() * 0.8));
    }
    // 2. the land around: trees thicken with distance; your end gets only low things (the angled view looks over it)
    const CELL = 8; // a tree at most every 8 m (near the board a real model of about 4000 triangles, further out an impostor)
    for (let gx = -hw - 50; gx < hw + 50; gx += CELL) for (let gz = -hd - 70; gz < hd + 40; gz += CELL) {
      const x = gx + rr() * CELL, z = gz + rr() * CELL, d = outside(x, z);
      if (d < 4) continue;
      const nearBoard = d < 16; // real models here: keep them fewer
      const behindMe = z > hd - 4 && Math.abs(x) < hw + 14;
      if (behindMe) { if (d < 22 && rr() < 0.35 * bi.grow) put(low(), x, z, 0.9 + rr() * 0.8); continue; }
      const p = Math.min(1, (d - 3) / 10) * (nearBoard ? 0.55 : 0.85) * bi.grow;
      if (rr() > p) { if (d < 16 && rr() < 0.6) put(low(), x, z, 0.9 + rr() * 0.9); continue; }
      if (!bi.trees.length || rr() < 0.12) { put(pickOf(L.rocks), x, z, 1.6 + rr() * 2.2); continue; } // a boulder now and then
      let tree = bi.trees[Math.floor(rr() * bi.trees.length)];
      if (nearBoard && /^Twisted/.test(tree)) tree = bi.trees[0]; // the big twisted trees (9000 triangles) only stand far out, as impostors
      put(tree, x, z, 1.6 + rr() * 0.9);
      if (nearBoard && rr() < 0.5) put(low(), x + (rr() - 0.5) * 4, z + (rr() - 0.5) * 4, 0.9 + rr() * 0.6); // undergrowth
    }
    // 3. grass round the board's edge, out in the open land
    for (let n = 0; n < 220 * bi.grow; n++) {
      const x = (rr() * 2 - 1) * (hw + 24), z = (rr() * 2 - 1) * (hd + 24), d = outside(x, z);
      if (d > 0.3 && d < 14) put(tuft(), x, z, 1.1 + rr() * 0.9);
    }
    // 4. on the board: a light dressing of small plants (not on walls or water), low enough to stay out of the way
    if (bi.dress) {
      const n = Math.round(COLS * ROWS * 1.2 * bi.dress);
      for (let i = 0; i < n; i++) {
        const x = (rr() - 0.5) * BW, z = (rr() - 0.5) * BD;
        put(pickOf(L.dress), x, z, 0.55 + rr() * 0.45, groundY(x, z));
      }
    }
    // 5. the oasis: water with a shallow rim and wet sand, reeds at the edge, palms round it
    for (const p of ponds) {
      [1.14, 1.04, 1].forEach((k, i) => { const m = new THREE.Mesh(pondGeo, pondMats[i]); m.scale.set(p.rx * k, 1, p.rz * k); m.position.set(p.x, 0.02 + i * 0.015, p.z); m.raycast = () => {}; m.name = 'pond'; scene.add(m); meshes.push(m); });
      const per = 2 * Math.PI * Math.sqrt((p.rx * p.rx + p.rz * p.rz) / 2);
      for (let s = 0; s < per; s += 1.4) { const a = s / per * Math.PI * 2 + rr() * 0.1, k = 0.96 + rr() * 0.12; put(rr() < 0.75 ? 'Grass_Common_Tall' : 'Grass_Wispy_Short', p.x + Math.cos(a) * p.rx * k, p.z + Math.sin(a) * p.rz * k, 1.2 + rr() * 0.9, 0, true); }
      for (let s = 0; s < per; s += 5.5) { const a = s / per * Math.PI * 2 + rr() * 0.3, k = 1.2 + rr() * 0.45; put(bi.trees[Math.floor(rr() * 4)], p.x + Math.cos(a) * p.rx * k, p.z + Math.sin(a) * p.rz * k, 1.5 + rr() * 0.9, 0, true); }
      for (let n = 0; n < 6; n++) { const a = rr() * Math.PI * 2, k = 1.15 + rr() * 0.3; put(pickOf(L.rocks), p.x + Math.cos(a) * p.rx * k, p.z + Math.sin(a) * p.rz * k, 0.8 + rr() * 1.4, 0, true); }
    }
    // 6. snow drifts round the board (Frozen Peak)
    if (bi.snow) {
      const dr = new THREE.InstancedMesh(driftGeo, driftMat, 120); let n = 0;
      for (let k = 0; k < 600 && n < 120; k++) {
        const x = (rr() * 2 - 1) * (hw + 45), z = -hd - 60 + rr() * (BD + 95), d = outside(x, z);
        if (d < 0.6 || d > 40 || rr() > 1.2 - d / 40) continue;
        const w = 2 + rr() * 4.5;
        dr.setMatrixAt(n++, tmpM.compose(tmpP.set(x, -0.1, z), tmpQ.setFromAxisAngle(upY, rr() * 6.3), tmpS.set(w * 1.4, 0.35 + rr() * 0.6, w * (0.35 + rr() * 0.35))));
      }
      dr.count = n; dr.instanceMatrix.needsUpdate = true; dr.computeBoundingSphere(); dr.raycast = () => {}; dr.receiveShadow = true; dr.name = 'drifts';
      scene.add(dr); meshes.push(dr);
    }
    // far trees and bushes: impostors
    snowU.value = bi.snow || 0; showSnow(!!bi.snow);
    bake([...new Set([...placed.keys()].filter((k) => k.endsWith('~')).map((k) => k.slice(0, -1)).filter(impostorable))].sort());
    const far = [];
    for (const [k, list] of [...placed]) {
      const name = k.replace('~', '');
      if (!k.endsWith('~') || !impIndex || !impIndex[name]) continue;
      for (const [x, y, z, ang, s, col] of list) far.push([name, x, y, z, s, col, ang < Math.PI ? 1 : -1]);
      placed.delete(k);
    }
    impostors(far);
    // the rest: one mesh per model part, holding every placement of that model
    for (const [k, list] of placed) {
      const md = lib[k.replace('~', '')], tall = md.h > 3 && !k.endsWith('~');
      for (const part of md.parts) {
        const im = new THREE.InstancedMesh(part.geo, part.mat, list.length);
        list.forEach(([x, y, z, ang, s, col], i) => {
          tmpP.set(x, y, z); tmpQ.setFromAxisAngle(upY, ang); tmpS.set(s, s * (0.95 + (ang % 1) * 0.15), s);
          im.setMatrixAt(i, tmpM.compose(tmpP, tmpQ, tmpS));
          im.setColorAt(i, tmpC.setRGB(col[0], col[1], col[2]));
        });
        im.instanceMatrix.needsUpdate = true; if (im.instanceColor) im.instanceColor.needsUpdate = true;
        im.castShadow = castShadows && tall; im.receiveShadow = false;
        im.computeBoundingSphere(); im.raycast = () => {}; // scenery never takes a touch
        im.name = k; scene.add(im); meshes.push(im);
      }
    }
  }
  function shadows(on) { if (on !== castShadows) { castShadows = on; key = ''; } }
  function dispose() { clear(); scene.remove(flakes); flakeGeo.dispose(); flakeMat.dispose(); driftGeo.dispose(); driftMat.dispose(); pondGeo.dispose(); for (const m of pondMats) m.dispose(); if (atlas) atlas.dispose(); if (impMat) { impMat.dispose(); impGeo.dispose(); blobMat.map.dispose(); blobMat.dispose(); blobGeo.dispose(); } for (const m of mats) { if (m.map) m.map.dispose(); m.dispose(); } if (lib) for (const md of Object.values(lib)) for (const p of md.parts) p.geo.dispose(); }
  return { _lib: () => lib, _meshes: () => meshes, update, biome, shadows, dispose, ready, tick, snowing: () => flakes.visible, count: () => meshes.reduce((s, m) => s + m.count, 0) };
};


// ===== The people in the room: static NPCs =====
// NPCs(THREE, scene, board) stands about 20 figures on tiles of the board. Each is No Mans Land's Flame Wizard body
// (src/models3d.js) without the hat, the beard and the staff: a robe in its own colour and a head. They don't move yet.
// board: { cols, rows, tile }. The board is centred on the origin, x across it, z down it (your side toward +z).
// Returns { list }: one { id, col, row, robe, skin, facing, group } per NPC.
const NPCs = (THREE, scene, board, opts = {}) => {
  const COUNT = opts.count || 20;
  const SCALE = 2.2; // about 4 m tall on a 6 m tile: bigger than NML's units, so people read on the wide board
  // robes: muted, distinct colours, so each person can be told apart from any view
  const ROBES = ['#B5523B', '#3E7CB1', '#D9A441', '#6B8F3A', '#8E5A9B', '#2F8F83', '#C9744A', '#5A6CB8', '#A63D5A', '#7F8A94',
    '#D27FA0', '#4F6D3A', '#C2B280', '#7A4A33', '#49A0C9', '#9C2F2F', '#E0C95A', '#355C6E', '#B48ACB', '#E4E0D4'];
  const SKINS = ['#F1C8A6', '#D9A27A', '#B57A52', '#8A5636', '#5E3A24'];
  // the Flame Wizard's body, as in NML: a 7-sided robe 1.5 m tall and a faceted head (an icosahedron) on top
  const robeGeo = new THREE.ConeGeometry(0.6, 1.5, 7); robeGeo.translate(0, 0.75, 0);
  const headGeo = new THREE.IcosahedronGeometry(0.25, 0); headGeo.translate(0, 1.6, 0);
  const mat = (hex) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.85, metalness: 0, flatShading: true });
  const skinMats = SKINS.map(mat);

  // seeded, so the room is the same every time it opens
  let sd = 4242; const rr = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; };
  const tiles = [];
  for (let r = 0; r < board.rows; r++) for (let c = 0; c < board.cols; c++) tiles.push([c, r]);
  for (let i = tiles.length - 1; i > 0; i--) { const j = Math.floor(rr() * (i + 1)); [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; }

  const T = board.tile, BW = board.cols * T, BD = board.rows * T;
  const list = [];
  for (let i = 0; i < Math.min(COUNT, tiles.length); i++) {
    const [col, row] = tiles[i], robe = ROBES[i % ROBES.length], skin = Math.floor(rr() * SKINS.length);
    const g = new THREE.Group();
    const body = new THREE.Mesh(robeGeo, mat(robe)), head = new THREE.Mesh(headGeo, skinMats[skin]);
    for (const m of [body, head]) { m.castShadow = true; m.receiveShadow = true; g.add(m); }
    const facing = rr() * Math.PI * 2;
    g.position.set((col + 0.5) * T - BW / 2, 0, (row + 0.5) * T - BD / 2);
    g.rotation.y = facing;
    g.scale.setScalar(SCALE);
    g.name = 'npc:' + i;
    scene.add(g);
    list.push({ id: i, col, row, robe, skin: SKINS[skin], facing, group: g });
  }
  return { list, height: 1.85 * SCALE };
};

// ===== The world: the board, the land around it, the NPCs and the camera =====
// World(THREE, el) builds the scene into el and draws it whenever something changed (the camera moving, a resize, the
// scenery finishing loading). The board is BOARD.cols x BOARD.rows tiles of BOARD.tile metres, centred on the origin.
const BOARD = { cols: 20, rows: 8, tile: 6 }; // NML's tiles (6 m), on a wider board: 120 x 48 m

const World = (THREE, el) => {
  const T = BOARD.tile, BW = BOARD.cols * T, BD = BOARD.rows * T;

  // ---------- three.js basics, set up as on NML's 3D board ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  el.appendChild(renderer.domElement);
  renderer.domElement.style.touchAction = 'none';
  el.addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#0D1315');
  scene.fog = new THREE.Fog('#0D1315', 90, 220);
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 600);
  scene.add(new THREE.HemisphereLight('#cfe3ff', '#20262a', 1.6));
  const sun = new THREE.DirectionalLight('#fff3dc', 2.2);
  sun.position.set(-30, 60, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096); // NML: 2048 for its 72 x 96 m board; this one is wider
  Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 60, bottom: -60, near: 1, far: 180 });
  scene.add(sun);

  // ---------- the floor: the painted meadow with its grid ----------
  const floorTex = new THREE.CanvasTexture(Floor.paint(BOARD.cols, BOARD.rows, 96));
  floorTex.colorSpace = THREE.SRGBColorSpace;
  floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(BW, BD), new THREE.MeshLambertMaterial({ map: floorTex }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  // the land around the board
  const around = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: '#141b1d' }));
  around.rotation.x = -Math.PI / 2; around.position.y = -0.05; around.receiveShadow = true;
  scene.add(around);

  // ---------- trees, bushes and grass round the board, and small plants on it (the meadow) ----------
  let dirty = true;
  const look = { cols: BOARD.cols, rows: BOARD.rows, look: 'meadow', id: 'agenda' };
  const scenery = Scenery3D(THREE, scene, { renderer, onReady: () => { scenery.update(look, () => 0, BW, BD, T); dirty = true; } });
  const bi = scenery.biome('meadow');
  scene.background.set(bi.sky); scene.fog.color.set(bi.sky); around.material.color.set(bi.land);

  // ---------- the people ----------
  const npcs = NPCs(THREE, scene, BOARD);

  // ---------- the camera: NML's controls, starting in (and going back to) the tilted view ----------
  const cam = Camera3D(THREE, camera, renderer.domElement, {
    width: BW, depth: BD, home: 1, farTop: npcs.height + 1,
    onInput: () => { dirty = true; },
  });

  function size() {
    const w = el.clientWidth || window.innerWidth, h = el.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
    cam.resize(w, h);
    dirty = true;
  }
  window.addEventListener('resize', size);
  size();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (dirty || cam.busy()) {
      dirty = false;
      cam.update(dt);
      // the fog and the far plane follow how far back the camera stands: a tall phone screen has to stand far
      // back to fit the wide board, further than NML's fog (90 to 220 m) reaches
      const d = camera.position.length();
      scene.fog.near = Math.max(90, d * 0.85); scene.fog.far = Math.max(220, d * 2.2);
      if (Math.abs(camera.far - Math.max(600, d * 3)) > 1) { camera.far = Math.max(600, d * 3); camera.updateProjectionMatrix(); }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return { scene, camera: cam, npcs, renderer, render: () => { dirty = true; } };
};

window.agenda = World(THREE, document.getElementById('world'));
</script>
