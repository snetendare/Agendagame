<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1315">
<title>Agenda</title>
<style>
:root { --bg: #0D1315; }
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
#world { position: fixed; inset: 0; }
#world canvas { display: block; }
.dev-bar { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; }
.labels { position: fixed; inset: 0; pointer-events: none; }
.dev { position: absolute; left: 0; top: 0; padding: 2px 5px; border-radius: 4px; background: rgba(20, 14, 10, 0.78); color: #F4EADC; font: 11px/1.25 ui-monospace, Menlo, monospace; white-space: nowrap; }
.dev[hidden], .toast[hidden] { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 8px;
  background: rgba(36, 27, 21, 0.94); color: #EFE6DA; font: 13px/1.35 system-ui, sans-serif; text-align: center; pointer-events: none; }
.seat { padding: 6px 10px; border: 0; border-radius: 6px;
  background: rgba(52, 40, 32, 0.78); color: #EFE6DA; font: 12px/1.3 system-ui, sans-serif; cursor: pointer; }
/* the popup over furniture: a small card, the action as one clear button */
.pop { position: fixed; left: 0; top: 0; display: grid; gap: 2px 12px; grid-template-columns: auto auto; align-items: center; padding: 8px 8px 8px 12px; border-radius: 8px;
  background: rgba(36, 27, 21, 0.92); color: #EFE6DA; font: 13px/1.3 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); }
.pop[hidden] { display: none; }
.pop-name { font-weight: 600; grid-column: 1; }
.pop-info { grid-column: 1; color: #BFAF9C; font-size: 12px; font-variant-numeric: tabular-nums; }
.pop-go { grid-column: 2; grid-row: 1 / span 2; padding: 8px 14px; border: 0; border-radius: 6px; background: #F2D16B; color: #2A1D12; font: 600 13px system-ui, sans-serif; cursor: pointer; }
.pop-go[hidden] { display: none; }
.pop-go:disabled { background: #6B5D50; color: #BFAF9C; cursor: default; }
.pop-go:focus-visible { outline: 2px solid #FFF; outline-offset: 2px; }
.seat:focus-visible { outline: 2px solid #F2D16B; outline-offset: 2px; }
.hint { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px);
  padding: 7px 12px; border-radius: 6px; background: rgba(52, 40, 32, 0.78); color: #EFE6DA; font: 13px/1.35 system-ui, sans-serif; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<div id="world"></div>
<div class="pop" id="pop" hidden><div class="pop-name" id="pop-name"></div><div class="pop-info" id="pop-info"></div><button class="pop-go" id="pop-go" type="button">Sit down</button></div>
<div class="labels" id="labels"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="hint">Tap a tile to walk there. Tap a person to talk, a table or chair to sit.</div>
<div class="dev-bar"><button class="seat" id="types" type="button">Show types</button><button class="seat" id="seat" type="button">You are player 1 · switch</button></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
// ===== 3D camera and its controls =====
// Taken from No Mans Land (src/camera3d.js) on 2026-11-03. Changes here: opts.home is the view the camera starts in
// and goes back to (Esc, a tap in a cinematic view); Agenda uses 1, the tilted view. opts.farTop replaces the enemy
// tower's height in the tilted fit. opts.tapsEverywhere: a tap in a cinematic view goes to opts.onTap too, instead of
// taking the camera back home.
// Camera3D(THREE, camera, el, opts) drives a THREE.PerspectiveCamera over the board from pointer, wheel and key input
// on the element el.
//
// Views: level 0 is the strategic view, straight down at the whole board (taps there go to opts.onTap as a ground
// point, so the game can place squads). There the page can also take a one-finger drag for itself (to move a squad):
// opts.onPress(point) on the press returns true to take it, then opts.onDrag(point) as it moves and opts.onDrop(point)
// when it lifts (null when a second finger or a cancel ends it); a short press still counts as a tap after the drop.
// onTap and onPress also get the screen point (clientX, clientY), and groundAt(clientX, clientY, h) finds where it
// meets a level h metres above the ground (to pick what stands there).
// A mouse moving over the strategic view with no button down goes to opts.onHover(point), null when it leaves.
// While opts.placing() is true (the player is deploying), the angled view takes taps, drags and hover the same way;
// a drag that the page doesn't take still looks around, and setLevel(k) (or a pinch, the wheel, Esc) changes view.
// Level 1 is the tilted view: most of the board from your side at TILT degrees, gentler than the angled view; it works
// like the strategic view (taps and drags go to the page, nothing to pan), but it can be rotated round the middle of the
// board: twist two fingers (or right/middle drag, Q/E). The turn carries on into the views further in and goes when
// the camera is back at the strategic view. Levels 2 and 3 are cinematic: angled, then
// close to the ground. In a cinematic view you can only look around: drag to move, twist (or right/middle drag, Q/E) to rotate, and a tap
// goes back to the strategic view.
// Every step in goes the same way: Strategic -> Tilted -> Angled -> Ground.
//   Touch: spread two fingers to go in, pinch to come back out. The camera follows the fingers, then settles on the
//          nearest level when they lift.
//   Mouse: the wheel steps a level in or out; a touchpad pinch (ctrl + wheel) works like the fingers.
//
// focus(k, x, z): the battle cam. While the strategic or tilted view is up, k from 0 to 1 moves it closer, lower and onto the
// ground point (x, z), easing in and back out on its own.
//
// opts.onInput() on every pointer, wheel and key event and when the camera starts gliding to a level (setLevel too),
// and busy() while it moves on its own, so a page that only draws when something changes knows when to draw.
// zoom() is where the gestures are: 0 strategic, 1 tilted, 2 angled, 3 ground (the level numbers), fractional in between.
// dispose() when the page is done with it.
//
// The ground is the plane y = 0, the board is opts.width x opts.depth metres centred on the origin, and the player's
// own side is toward +z (the bottom of the screen in the strategic view).
const Camera3D = (THREE, camera, el, opts) => {
  const W = opts.width, D = opts.depth;
  const FOV = camera.fov;
  // the levels: pitch (degrees above the horizon) and distance from the point looked at (metres)
  const LEVELS = [null, null, { pitch: 26, dist: 80 }, { pitch: 20, dist: 24 }]; // strategic and tilted fit the board; angled: low, far back to see the enemy side
  const MAX = LEVELS.length - 1;
  const TAP_MOVE = 10, TAP_MS = 350;   // a touch that moves less than this many px and lifts this fast is a tap
  const PINCH_DEAD = Math.log(1.06);   // the fingers must spread or close by 6% before the view zooms
  const TWIST_DEAD = 10 * Math.PI / 180; // and twist by 10 degrees before it rotates
  const PINCH_PER_LEVEL = Math.log(2.1); // spreading the fingers 2.1x apart goes in one level
  const PAN_SPEED = 2;                 // a drag moves the view this many times as far as the finger
  const TILT = 50;                     // pitch of the tilted view (degrees above the horizon)
  const TILT_IN = 1;                   // the tilted view sits this much closer than a fit of the whole board (below 1 the far corners may leave the screen)
  const TILT_IN_PC = 1;                 // the same on a PC (a wide window beside the panel)
  const FAR_TOP = opts.farTop ?? 13;   // the tilted fit also keeps this height above the far edge on screen (NML: the enemy tower, its flag and health bar)
  const HOME = opts.home || 0;         // the standard view: where the camera starts and goes back to
  const FOCUS = { pitch: 58, dist: 0.6 }; // the battle cam at full strength: at most this pitch, this much of the view's distance

  // zoom along the gestures: 0 strategic, 1 tilted, 2 angled, 3 ground (fractional while pinching or settling)
  const ZMIN = 0, ZMAX = MAX;
  let z = HOME;
  let target = new THREE.Vector3(); // the point a cinematic view looks at (on the ground)
  let yaw = 0;                // rotation of the tilted and cinematic views around the vertical axis (radians, 0 = from your side)
  let settle = null;          // { from, to, t } while z glides to a level
  let aspect = 1, viewH = 1;
  let tilt = { pitch: TILT, dist: 100, tz: 0 }; // the tilted view: distance and look point that fit the board (fitTilted)
  const foc = { k: 0, x: 0, z: 0 }, focT = { k: 0, x: 0, z: 0 }; // the battle cam now, and where it's heading
  const woke = () => { if (opts.onInput) opts.onInput(); };
  const clampTarget = () => {
    target.x = Math.max(-W / 2 - 4, Math.min(W / 2 + 4, target.x));
    target.z = Math.max(-D / 2 - 4, Math.min(D / 2 + 4, target.z));
  };
  // the strategic view: straight down from high enough to fit the whole board
  const strategicDist = () => {
    const tan = Math.tan(FOV * Math.PI / 360);
    return Math.max(D / 2 / tan, W / 2 / (tan * aspect)) * 1.03;
  };
  // the tilted view: the distance, and the look point (z) that centres the board on the screen, so all four
  // corners (and models standing on them) fit
  const probe = new THREE.PerspectiveCamera(FOV, 1, 1, 1000), corner = new THREE.Vector3();
  function fitTilted() {
    const p = TILT * Math.PI / 180;
    probe.aspect = aspect; probe.updateProjectionMatrix();
    const ext = (d, tz) => {
      probe.position.set(0, Math.sin(p) * d, tz + Math.cos(p) * d); probe.lookAt(0, 0, tz); probe.updateMatrixWorld();
      let x = 0, y0 = Infinity, y1 = -Infinity;
      const pts = [];
      for (const cx of [-W / 2, W / 2]) for (const cz of [-D / 2, D / 2]) for (const h of [0, 2.5]) pts.push([cx, h, cz]);
      for (const cx of [-W / 4, 0, W / 4]) pts.push([cx, FAR_TOP, -D / 2]); // the enemy tower's top, flag and health bar
      for (const [cx, h, cz] of pts) {
        corner.set(cx, h, cz).project(probe);
        x = Math.max(x, Math.abs(corner.x)); y0 = Math.min(y0, corner.y); y1 = Math.max(y1, corner.y);
      }
      return { x, y0, y1 };
    };
    const centre = (d) => { // the board's middle on the screen rises as the look point comes toward you
      let lo = -D, hi = D;
      for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2, e = ext(d, mid); if (e.y0 + e.y1 > 0) hi = mid; else lo = mid; }
      return (lo + hi) / 2;
    };
    let lo = 10, hi = 600;
    for (let i = 0; i < 30; i++) {
      const d = (lo + hi) / 2, e = ext(d, centre(d));
      if (e.x <= 0.97 && (e.y1 - e.y0) / 2 <= 0.97) hi = d; else lo = d;
    }
    const tin = document.documentElement.classList.contains('pc') ? TILT_IN_PC : TILT_IN;
    tilt = { pitch: TILT, dist: hi * tin, tz: centre(hi * tin) };
  }
  // pitch and distance for any zoom value, gliding between levels (distance on a log scale, so it feels even)
  function pose(zz) {
    // on a screen taller than the 12:16 board, the cinematic views step back so they still see as far to the sides
    const lv = (u) => u === 0 ? { pitch: 90, dist: strategicDist() } : u === 1 ? { pitch: tilt.pitch, dist: tilt.dist } : { pitch: LEVELS[u].pitch, dist: LEVELS[u].dist * Math.max(1, 0.75 / aspect) };
    const k = Math.max(ZMIN, Math.min(ZMAX - 1, Math.floor(zz))), f = zz - k, a = lv(k), b = lv(k + 1);
    return { pitch: a.pitch + (b.pitch - a.pitch) * f, dist: Math.exp(Math.log(a.dist) + (Math.log(b.dist) - Math.log(a.dist)) * f) };
  }
  function apply() {
    let { pitch, dist } = pose(z);
    // strategic to tilted, the look point slides to the tilted one and the turn grows from none (the tilted view turns
    // round the middle of the board, its look point with it); from tilted in to angled, the look point slides on to
    // the cinematic one
    const s1 = Math.max(0, Math.min(1, z)), w = Math.max(0, Math.min(1, z - 1)), yw = yaw * s1, z0 = tilt.tz * s1;
    const lx = Math.sin(yw) * z0, lz = Math.cos(yw) * z0;
    let tx = lx + (target.x - lx) * w, tz = lz + (target.z - lz) * w;
    // the battle cam, on the strategic and tilted views only (it fades as the player goes in)
    const fk = foc.k * (1 - w);
    if (fk > 0) {
      pitch += (Math.min(pitch, FOCUS.pitch) - pitch) * fk; dist *= Math.pow(FOCUS.dist, fk);
      tx += (foc.x - tx) * fk; tz += (foc.z - tz) * fk;
    }
    const p = pitch * Math.PI / 180, h = Math.cos(p) * dist;
    camera.position.set(tx + Math.sin(yw) * h, Math.sin(p) * dist, tz + Math.cos(yw) * h);
    camera.up.set(-Math.sin(yw), 0, -Math.cos(yw)); // "up" on the screen points away from the camera, so straight down works too
    camera.lookAt(tx, 0, tz);
    camera.updateProjectionMatrix();
  }
  const level = () => Math.round(z);
  const strategic = () => Math.abs(z) < 0.01 && !settle;
  // the views where taps, drags and hover go to the page: strategic, tilted, and angled while the player is placing
  const handsOn = () => strategic() || (!settle && (Math.abs(z - 1) < 0.01 || (Math.abs(z - 2) < 0.01 && !!(opts.placing && opts.placing()))));
  const cinematic = () => z > 1.01; // in from the tilted view: the look point and turn count
  const turnable = () => z > 0.7; // the tilted view and further in can be rotated
  function settleTo(to) {
    to = Math.max(ZMIN, Math.min(ZMAX, to));
    settle = { from: z, to, t: 0 };
    if (opts.onLevel) opts.onLevel(to);
    woke();
  }
  // the nearest level when the fingers lift; it takes a fair push to leave the strategic view
  const nearest = () => z < 0.35 ? 0 : Math.min(ZMAX, Math.max(1, Math.round(z)));
  function goStrategic() { settleTo(0); }
  function goHome() { settleTo(HOME); }

  // the point on the ground under a screen point (null if it's above the horizon)
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  // the point under a screen point on the ground, or (h metres) on a level that high above it
  const level_ = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function groundAt(cx, cy, h = 0) {
    const r = el.getBoundingClientRect();
    ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = new THREE.Vector3();
    if (!h) return ray.ray.intersectPlane(ground, hit);
    level_.constant = -h;
    const p = ray.ray.intersectPlane(level_, hit);
    if (p) p.y = 0;
    return p;
  }
  // a cinematic view, when it comes, looks at the ground under a screen point
  function aimAt(cx, cy) {
    const g = groundAt(cx, cy);
    if (g) { target.set(g.x, 0, g.z); clampTarget(); }
    if (z < 0.5) yaw = 0; // from the tilted view the turn stays
  }
  // move the look point so the ground follows a drag of dx, dy px
  function pan(dx, dy) {
    const { pitch, dist } = pose(z), k = PAN_SPEED * 2 * dist * Math.tan(FOV * Math.PI / 360) / viewH;
    const s = Math.sin(pitch * Math.PI / 180);
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    target.x += -rx * dx * k + fx * dy * k / s;
    target.z += -rz * dx * k + fz * dy * k / s;
    clampTarget();
  }

  // ---------- pointers: one finger or the left button pans or taps, two fingers pinch and twist ----------
  const pts = new Map();      // pointerId -> { x, y }
  let tap = null;             // a press that may still turn out to be a tap
  let two = null;             // the two-finger gesture under way
  let rotDrag = null;         // a right / middle button drag that rotates
  let grab = null;            // pointerId of a one-finger drag the page took (opts.onPress)
  function dropGrab(p) { if (grab == null) return; grab = null; if (opts.onDrop) opts.onDrop(p); }
  const pair = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(b.x - a.x, b.y - a.y), ang: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; };
  function startTwo() {
    const p = pair();
    settle = null;
    dropGrab(null);
    if (!cinematic()) aimAt(p.mx, p.my);
    if (Math.abs(z - Math.round(z)) < 0.01) z = Math.round(z);
    two = { d0: p.d, a0: p.ang, z0: z, yaw0: yaw, mx: p.mx, my: p.my, zooming: false, turning: false };
    tap = null;
  }
  el.addEventListener('pointerdown', (e) => {
    woke();
    if (e.pointerType === 'mouse' && e.button !== 0) {
      e.preventDefault();
      if (turnable()) rotDrag = { x: e.clientX };
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    if (pts.size === 1) {
      tap = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      if (handsOn() && opts.onPress && opts.onPress(groundAt(e.clientX, e.clientY), e.clientX, e.clientY)) grab = e.pointerId;
    }
    else if (pts.size === 2) startTwo();
  });
  el.addEventListener('pointermove', (e) => {
    woke();
    if (rotDrag) { yaw -= (e.clientX - rotDrag.x) * 0.008; rotDrag.x = e.clientX; return; }
    const p0 = pts.get(e.pointerId);
    if (!p0) { if (e.pointerType === 'mouse' && !e.buttons && handsOn() && opts.onHover) opts.onHover(groundAt(e.clientX, e.clientY)); return; }
    const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
    p0.x = e.clientX; p0.y = e.clientY;
    if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > TAP_MOVE) tap = null;
    if (grab === e.pointerId) { if (opts.onDrag) opts.onDrag(groundAt(e.clientX, e.clientY)); return; }
    if (pts.size === 1 && !tap && cinematic()) pan(dx, dy);
    if (pts.size === 2 && two) {
      const p = pair(), s = Math.log(p.d / two.d0), turn = Math.atan2(Math.sin(p.ang - two.a0), Math.cos(p.ang - two.a0));
      if (!two.zooming && Math.abs(s) > PINCH_DEAD) { two.zooming = true; two.sOff = Math.sign(s) * PINCH_DEAD; }
      if (!two.turning && Math.abs(turn) > TWIST_DEAD && turnable()) { two.turning = true; two.aOff = Math.sign(turn) * TWIST_DEAD; }
      if (two.zooming) z = Math.max(ZMIN, Math.min(ZMAX, two.z0 + (s - two.sOff) / PINCH_PER_LEVEL));
      if (two.turning) yaw = two.yaw0 + (turn - two.aOff); // the view turns the way the fingers twist
      if (z > 1.3) pan(p.mx - two.mx, p.my - two.my); // the two fingers moving together drag the view too
      two.mx = p.mx; two.my = p.my;
    }
  });
  function lift(e) {
    woke();
    if (rotDrag && e.pointerType === 'mouse' && e.button !== 0) { rotDrag = null; return; }
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (grab === e.pointerId) dropGrab(e.type === 'pointerup' ? groundAt(e.clientX, e.clientY) : null);
    if (tap && tap.id === e.pointerId && e.type === 'pointerup' && performance.now() - tap.t < TAP_MS) {
      swallow = { x: e.clientX, y: e.clientY, t: performance.now() };
      if (handsOn() || opts.tapsEverywhere) { if (opts.onTap) opts.onTap(groundAt(e.clientX, e.clientY), e.clientX, e.clientY); }
      else goHome();
    }
    tap = null;
    if (two && pts.size < 2) { two = null; settleTo(nearest()); }
  }
  // the click the browser sends after a tap: the tap was taken on the lift, so whatever it opened (a sheet over the
  // board) must not get that click too, or it lands on the sheet's backdrop and closes it, or on one of its buttons
  let swallow = null;
  function swallowClick(e) {
    if (swallow && performance.now() - swallow.t < 700 && Math.hypot(e.clientX - swallow.x, e.clientY - swallow.y) < 30) { e.stopPropagation(); e.preventDefault(); }
    swallow = null;
  }
  window.addEventListener('click', swallowClick, true);
  el.addEventListener('pointerup', lift);
  el.addEventListener('pointercancel', lift);
  el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && opts.onHover) opts.onHover(null); });
  el.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- wheel: a notch steps a level (toward the pointer from the strategic view); ctrl + wheel is a touchpad pinch ----------
  let wheelAcc = 0, wheelBlock = 0, pinchIdle = 0;
  el.addEventListener('wheel', (e) => {
    e.preventDefault(); woke();
    const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    if (e.ctrlKey) { // touchpad pinch
      settle = null;
      if (!cinematic() && dy < 0) aimAt(e.clientX, e.clientY);
      z = Math.max(ZMIN, Math.min(ZMAX, z - dy * 0.012));
      clearTimeout(pinchIdle); pinchIdle = setTimeout(() => settleTo(nearest()), 220);
      return;
    }
    const now = performance.now();
    if (now < wheelBlock) return; // touchpads send a stream of small scrolls: one step per gesture
    wheelAcc += dy;
    if (Math.abs(wheelAcc) < 40) return;
    const to = Math.round(z) + (wheelAcc < 0 ? 1 : -1);
    wheelAcc = 0; wheelBlock = now + 260;
    if (to < ZMIN || to > ZMAX) return;
    if (!cinematic() && to === 2) aimAt(e.clientX, e.clientY);
    settleTo(to);
  }, { passive: false });

  // ---------- keys: Q / E rotate, Escape goes back to the strategic view ----------
  const keys = new Set();
  const keyDown = (e) => { woke(); keys.add(e.key.toLowerCase()); if (e.key === 'Escape') goHome(); };
  const keyUp = (e) => keys.delete(e.key.toLowerCase());
  window.addEventListener('keydown', keyDown);
  window.addEventListener('keyup', keyUp);
  // the page is done with this camera: let go of the window's keys (the element's listeners go with the element)
  function dispose() { window.removeEventListener('click', swallowClick, true); window.removeEventListener('keydown', keyDown); window.removeEventListener('keyup', keyUp); keys.clear(); }

  function update(dt) {
    if (settle) {
      settle.t = Math.min(1, settle.t + dt / 0.3);
      const e = 1 - Math.pow(1 - settle.t, 3); // ease out
      z = settle.from + (settle.to - settle.from) * e;
      if (settle.t >= 1) { z = settle.to; settle = null; if (z < 0.5) yaw = 0; }
    }
    if (foc.k !== focT.k) {
      foc.k += (focT.k - foc.k) * Math.min(1, dt * 3);
      if (Math.abs(foc.k - focT.k) < 0.002) foc.k = focT.k;
    }
    if (focT.k > 0) { foc.x = focT.x; foc.z = focT.z; }
    if (turnable() && !settle) { if (keys.has('q')) yaw += dt * 1.6; if (keys.has('e')) yaw -= dt * 1.6; }
    apply();
  }
  // go to a level; into the angled view from the strategic or tilted one, it looks at your own half of the board
  // (the half nearest the camera, when the tilted view was turned)
  function setLevel(k) {
    if (k > 1 && !cinematic()) { if (z < 0.5) yaw = 0; target.set(Math.sin(yaw) * D / 4, 0, Math.cos(yaw) * D / 4); }
    settleTo(k);
  }
  function resize(width, height) { aspect = width / height; viewH = height; camera.aspect = aspect; fitTilted(); apply(); }
  // the battle cam (see the top); x, z on the ground
  function focus(k, x = 0, zz = 0) {
    if (k > 0 && foc.k === 0) { foc.x = x; foc.z = zz; }
    focT.k = Math.max(0, Math.min(1, k)); focT.x = x; focT.z = zz;
  }

  // moving on its own (gliding to a level, a gesture under way, a rotate key held), so the page should keep drawing
  const busy = () => !!settle || !!two || !!rotDrag || keys.has('q') || keys.has('e') || foc.k !== focT.k;
  return { update, resize, groundAt, goStrategic, goHome, setLevel, strategic, handsOn, level, busy, dispose, zoom: () => z, LEVELS: MAX + 1, focus };
};

// ===== The painted floor: polished wood parquet, with the tile grid in its joints =====
// Floor.paint(cols, rows, tilePx) -> a canvas with the board's floor painted on it. Each tile is one square of
// basket-weave parquet: four blocks, each of four strips, the strips turning a quarter between neighbouring blocks.
// The joints between tiles are a little darker, so the grid still reads. Seeded, so it looks the same every time.
// (The theme is a high-society dinner party, indoors; the first version was No Mans Land's meadow.)
const Floor = (() => {
  const WOOD = ['#6B4128', '#73472C', '#7C4F31', '#633B24', '#815536', '#6F442A'];
  const GRAIN = ['#4E2C19', '#8E6140'];
  const GRID = 'rgba(18, 8, 3, 0.8)';
  function paint(cols, rows, t) {
    const W = cols * t, H = rows * t;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    let sd = 31337; const rr = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; };
    const b = t / 2, strip = b / 4, gap = Math.max(1, t / 96);
    for (let ty = 0; ty < rows; ty++) for (let tx = 0; tx < cols; tx++) for (let by = 0; by < 2; by++) for (let bx = 0; bx < 2; bx++) {
      const x0 = tx * t + bx * b, y0 = ty * t + by * b, across = (bx + by + tx + ty) % 2 === 0;
      for (let s = 0; s < 4; s++) {
        const [x, y, w, h] = across ? [x0, y0 + s * strip, b, strip] : [x0 + s * strip, y0, strip, b];
        c.fillStyle = WOOD[Math.floor(rr() * WOOD.length)]; c.fillRect(x, y, w, h);
        // grain along the strip
        for (let k = 0; k < 5; k++) {
          c.globalAlpha = 0.18 + rr() * 0.2; c.strokeStyle = GRAIN[rr() < 0.7 ? 0 : 1]; c.lineWidth = 0.5 + rr() * 0.9;
          const o = (0.15 + rr() * 0.7) * (across ? h : w), wob = (rr() - 0.5) * 1.6;
          c.beginPath();
          if (across) { c.moveTo(x, y + o); c.quadraticCurveTo(x + w / 2, y + o + wob, x + w, y + o); }
          else { c.moveTo(x + o, y); c.quadraticCurveTo(x + o + wob, y + h / 2, x + o, y + h); }
          c.stroke();
        }
        c.globalAlpha = 1;
        // the hairline joint round each strip
        c.strokeStyle = 'rgba(30, 16, 8, 0.45)'; c.lineWidth = gap * 0.6; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      }
    }
    // a soft sheen: a few broad, faint highlights, as a polished floor catches the light
    for (let k = 0; k < Math.round(cols * rows / 12); k++) {
      const x = rr() * W, y = rr() * H, r = t * (1.5 + rr() * 2.5), g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255, 226, 190, 0.07)'); g.addColorStop(1, 'rgba(255, 226, 190, 0)');
      c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // the grid: the joints between tiles, darker and a little wider
    c.strokeStyle = GRID; c.lineWidth = gap * 2.4;
    for (let i = 1; i < cols; i++) { c.beginPath(); c.moveTo(i * t, 0); c.lineTo(i * t, H); c.stroke(); }
    for (let i = 1; i < rows; i++) { c.beginPath(); c.moveTo(0, i * t); c.lineTo(W, i * t); c.stroke(); }
    return cv;
  }
  return { paint };
})();

// ===== The room: four walls round the board =====
// Room(THREE, scene, BW, BD) walls in the board (BW x BD metres, centred on the origin): wood panelling up to a
// chair rail, plaster above, a skirting at the foot and a cornice at the top. No furniture or other dressing yet.
// Like a doll's house, a wall the camera is outside of drops to its low panelling, so it never hides the room:
// update(camera) once per drawn frame picks which. Rotating the view (Q / E) swaps which walls are low.
const Room = (THREE, scene, BW, BD) => {
  const H = 8;            // wall height (m): above the people (4 m), below most of their pies when held up
  const LOW = 1.1;        // a cut-away wall: its panelling, up to the rail
  const TH = 0.5;         // wall thickness
  const PANEL = 1.4;      // the panelling's height in a full wall
  const std = (color, rough) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0 });
  const plaster = std('#2E4A43', 0.9), panel = std('#4A2E1E', 0.6), trim = std('#D8CBAE', 0.55);
  const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; };
  // a wall along x (length L), its room side toward +z, built at the origin; full or low
  function wall(L, full) {
    const g = new THREE.Group(), top = full ? H : LOW, pH = full ? PANEL : LOW - 0.12;
    g.add(box(L, pH, TH, panel, 0, pH / 2, 0));
    g.add(box(L, 0.25, TH + 0.08, trim, 0, 0.125, 0.04));            // skirting
    g.add(box(L, 0.1, TH + 0.12, trim, 0, pH + 0.05, 0.06));        // chair rail
    if (full) {
      g.add(box(L, H - pH - 0.1, TH, plaster, 0, pH + 0.1 + (H - pH - 0.1) / 2, 0));
      g.add(box(L, 0.35, TH + 0.25, trim, 0, H - 0.175, 0.125));    // cornice
    } else g.add(box(L, 0.08, TH + 0.12, trim, 0, top, 0.06));      // cap on the cut
    return g;
  }
  // each side: where it stands, which way the room is from it (its inward normal), and both versions of its wall
  const sides = [
    { x: 0, z: -BD / 2 - TH / 2, ry: 0, n: [0, 1], L: BW + TH * 2 },          // far
    { x: 0, z: BD / 2 + TH / 2, ry: Math.PI, n: [0, -1], L: BW + TH * 2 },    // near
    { x: -BW / 2 - TH / 2, z: 0, ry: Math.PI / 2, n: [1, 0], L: BD },         // left
    { x: BW / 2 + TH / 2, z: 0, ry: -Math.PI / 2, n: [-1, 0], L: BD },        // right
  ].map((s) => {
    const full = wall(s.L, true), low = wall(s.L, false);
    for (const w of [full, low]) { w.position.set(s.x, 0, s.z); w.rotation.y = s.ry; scene.add(w); }
    return { ...s, full, low };
  });
  // the camera outside a wall's line (on the far side of it from the room) sees the low version
  function update(camera) {
    const p = camera.position;
    for (const s of sides) {
      const outside = (p.x - s.x) * s.n[0] + (p.z - s.z) * s.n[1] < 0;
      s.full.visible = !outside; s.low.visible = outside;
    }
  }
  return { update, height: H };
};

// ===== The match: what is drawn at random once per match and then stays the same =====
// Match(seed) -> { seed, rng() }. rng is a seeded random generator, so everything picked from it (who stands where,
// robe and skin colours, which two figures the players are) is the same for anyone who starts from the same seed:
// a networked match only has to share the seed. A new page load is a new match with a new seed.
const Match = (seed = Math.floor(Math.random() * 2147483646) + 1) => {
  let sd = seed % 2147483647 || 1;
  const rng = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; };
  return { seed, rng };
};

// ===== Furniture: the things people use (the dining table, standing tables, the bar, chairs by the walls) =====
// Furniture(THREE, scene, board) places the pieces on the tiles of the board and gives each its places to be:
//   the dining table, 3 x 1 tiles, 8 seats round it (3 on each long side, one at each end)
//   2 standing (mingle) tables, 1 tile each, 3 places to stand at each
//   the bar against the far wall, 2 tiles, 2 stools
//   4 single chairs against the walls
// Each piece: { id, kind, name, verb, tiles: [[col, row]], seats, group, top (height of its top, m) }.
// Each seat: { id, furniture, col, row, pose ('sit' or 'stand'), x, z (where the body goes), y (how high it sits),
// yaw (which way it faces), by (the character using it or walking to it, else null) }.
// The furniture's tiles can't be walked on, and neither can a seat's tile except by the one going to that seat
// (src/movement.js). Sized for the people: a figure is about 4 m tall (2.2 times a person), so is the furniture.
const Furniture = (THREE, scene, board) => {
  const T = board.tile, BW = board.cols * T, BD = board.rows * T;
  const K = 2.2; // people are drawn 2.2 times life size: so is everything they use
  const centre = (c, r) => [(c + 0.5) * T - BW / 2, (r + 0.5) * T - BD / 2];
  const std = (color, rough = 0.7, metal = 0) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
  const M = { wood: std('#3B2416', 0.55), cloth: std('#F2EEE6', 0.9), brass: std('#C9A24A', 0.35, 0.6), marble: std('#E6E1D8', 0.3),
    velvet: std('#7A1F2B', 0.95), china: std('#FBFAF6', 0.35), candle: std('#FFF4DC', 0.6), glass: [std('#2F5A3A', 0.25), std('#6B1E24', 0.25), std('#C79A3B', 0.25), std('#3A3F6B', 0.25)] };
  const add = (g, geo, mat, x, y, z, ry = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.y = ry; m.castShadow = true; m.receiveShadow = true; g.add(m); return m; };
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cyl = (rt, rb, h, n = 20) => new THREE.CylinderGeometry(rt, rb, h, n);

  // ---------- the models (each built at the origin, its front toward -z) ----------
  // a dining chair: velvet seat and back, dark wood legs. The sitter sits over its middle, facing -z.
  const SEAT_Y = 0.46 * K;
  function chair() {
    const g = new THREE.Group(), s = 0.48 * K, legH = SEAT_Y - 0.08;
    for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) add(g, box(0.1, legH, 0.1), M.wood, x * (s / 2 - 0.08), legH / 2, z * (s / 2 - 0.08));
    add(g, box(s, 0.12, s), M.wood, 0, legH + 0.06, 0);
    add(g, box(s - 0.12, 0.12, s - 0.12), M.velvet, 0, legH + 0.18, 0);
    add(g, box(s, 0.5 * K, 0.12), M.wood, 0, SEAT_Y + 0.25 * K, s / 2 - 0.06);
    add(g, box(s - 0.2, 0.4 * K, 0.06), M.velvet, 0, SEAT_Y + 0.27 * K, s / 2 - 0.15);
    return g;
  }
  // a bar stool: brass pedestal, round velvet seat
  const STOOL_Y = 0.76 * K;
  function stool() {
    const g = new THREE.Group();
    add(g, cyl(0.45, 0.5, 0.08), M.brass, 0, 0.04, 0);
    add(g, cyl(0.07, 0.07, STOOL_Y - 0.2, 10), M.brass, 0, (STOOL_Y - 0.2) / 2, 0);
    add(g, new THREE.TorusGeometry(0.4, 0.04, 6, 20), M.brass, 0, STOOL_Y * 0.4, 0).rotation.x = Math.PI / 2;
    add(g, cyl(0.6, 0.55, 0.22), M.velvet, 0, STOOL_Y - 0.1, 0);
    return g;
  }

  // ---------- the pieces ----------
  const list = [], seats = [];
  // a seat on tile (col, row), its body pushed `inward` metres toward (fx, fz) (the direction it faces, a unit vector)
  function seat(f, col, row, pose, fx, fz, inward, y, model) {
    const [cx, cz] = centre(col, row), x = cx + fx * inward, z = cz + fz * inward, yaw = Math.atan2(-fx, -fz);
    const s = { id: seats.length, furniture: f.id, col, row, pose, x, z, y, yaw, by: null };
    if (model) { model.position.set(x, 0, z); model.rotation.y = yaw; tag(model, f.id); scene.add(model); f.parts.push(model); }
    seats.push(s); f.seats.push(s);
    return s;
  }
  function piece(kind, name, verb, tiles, top) {
    const f = { id: list.length, kind, name, verb, tiles, seats: [], group: new THREE.Group(), parts: [], top };
    tag(f.group, f.id); scene.add(f.group); list.push(f);
    return f;
  }
  const tag = (o, id) => o.traverse((m) => { m.userData.furniture = id; });

  // the dining table: cols 8 to 10, row 3, a white cloth, a plate and glass at every place, candlesticks down the middle
  {
    const TOP = 0.75 * K, c0 = 8, r = 3, L = 3 * T - 2.2, Wd = T - 1.6;
    const f = piece('dining', 'Dining table', 'Sit down', [[c0, r], [c0 + 1, r], [c0 + 2, r]], TOP);
    const [x0, z0] = centre(c0 + 1, r);
    const g = f.group; g.position.set(x0, 0, z0);
    for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) add(g, box(0.25, TOP - 0.1, 0.25), M.wood, sx * (L / 2 - 0.6), (TOP - 0.1) / 2, sz * (Wd / 2 - 0.5));
    add(g, box(L, 0.12, Wd), M.wood, 0, TOP - 0.06, 0);
    add(g, box(L + 0.3, 0.06, Wd + 0.3), M.cloth, 0, TOP + 0.02, 0);
    for (const sz of [-1, 1]) add(g, box(L + 0.3, 0.7, 0.05), M.cloth, 0, TOP - 0.33, sz * (Wd / 2 + 0.15)); // the cloth hanging over the sides
    for (const sx of [-1, 1]) add(g, box(0.05, 0.7, Wd + 0.3), M.cloth, sx * (L / 2 + 0.15), TOP - 0.33, 0);
    for (const dx of [-T, 0, T]) { // candlesticks
      add(g, cyl(0.12, 0.28, 0.9, 12), M.brass, dx, TOP + 0.5, 0);
      add(g, cyl(0.07, 0.07, 0.6, 8), M.candle, dx, TOP + 1.25, 0);
    }
    const IN = 2.0;
    for (let k = 0; k < 3; k++) {
      seat(f, c0 + k, r - 1, 'sit', 0, 1, IN, SEAT_Y, chair());
      seat(f, c0 + k, r + 1, 'sit', 0, -1, IN, SEAT_Y, chair());
      for (const sz of [-1, 1]) { // a plate and a glass at each place on this side
        const px = (k - 1) * T, pz = sz * (Wd / 2 - 0.75);
        add(g, cyl(0.42, 0.34, 0.05, 20), M.china, px, TOP + 0.08, pz);
        add(g, cyl(0.1, 0.07, 0.45, 10), M.glass[(k + (sz > 0 ? 1 : 0)) % 4], px + 0.7, TOP + 0.28, pz - sz * 0.25);
      }
    }
    seat(f, c0 - 1, r, 'sit', 1, 0, IN, SEAT_Y, chair());
    seat(f, c0 + 3, r, 'sit', -1, 0, IN, SEAT_Y, chair());
    for (const sx of [-1, 1]) add(g, cyl(0.42, 0.34, 0.05, 20), M.china, sx * (L / 2 - 0.7), TOP + 0.08, 0);
  }

  // standing tables: a tall round table in a fitted white cover, three places round it
  for (const [c, r, spots] of [[4, 5, [[-1, 0], [1, 0], [0, 1]]], [15, 2, [[-1, 0], [1, 0], [0, 1]]]]) {
    const TOP = 1.1 * K;
    const f = piece('mingle', 'Standing table', 'Join table', [[c, r]], TOP);
    const [x0, z0] = centre(c, r), g = f.group; g.position.set(x0, 0, z0);
    add(g, cyl(1.5, 1.5, 0.12, 28), M.cloth, 0, TOP - 0.06, 0);
    add(g, cyl(1.45, 0.35, TOP * 0.55, 28), M.cloth, 0, TOP - 0.12 - TOP * 0.275, 0);  // the cover, drawn in at the waist
    add(g, cyl(0.35, 1.0, TOP * 0.33, 28), M.cloth, 0, TOP * 0.165, 0);                  // and flaring to the floor
    add(g, cyl(0.1, 0.07, 0.45, 10), M.glass[c % 4], 0.5, TOP + 0.22, 0.3);
    add(g, cyl(0.1, 0.07, 0.45, 10), M.glass[(c + 1) % 4], -0.4, TOP + 0.22, -0.4);
    for (const [dc, dr] of spots) seat(f, c + dc, r + dr, 'stand', -dc, -dr, 2.2, 0, null);
  }

  // the bar: a counter on the far wall's first row, cols 1 and 2, marble top and brass foot rail, bottles on the shelf
  {
    const TOP = 1.08 * K, c0 = 1, r = 0, L = 2 * T - 0.6, D = 2.4;
    const f = piece('bar', 'Bar', 'Sit down', [[c0, r], [c0 + 1, r]], TOP);
    const [xa] = centre(c0, r), [xb, z0] = centre(c0 + 1, r), g = f.group;
    g.position.set((xa + xb) / 2, 0, z0 + 0.6);
    add(g, box(L, TOP - 0.1, D), M.wood, 0, (TOP - 0.1) / 2, 0);
    add(g, box(L + 0.3, 0.14, D + 0.35), M.marble, 0, TOP - 0.03, 0.1);
    add(g, cyl(0.06, 0.06, L, 8), M.brass, 0, 0.45, D / 2 + 0.35).rotation.z = Math.PI / 2;
    // the back bar: a shelf on the wall behind, with bottles
    const zb = -BD / 2 - z0 - 0.6 + 0.6;
    add(g, box(L, 0.12, 0.9), M.wood, 0, 3.6, zb);
    for (let k = 0; k < 12; k++) {
      const bx = -L / 2 + 0.6 + k * (L - 1.2) / 11, h = 0.9 + (k * 7 % 5) * 0.12;
      add(g, cyl(0.16, 0.18, h, 10), M.glass[k % 4], bx, 3.66 + h / 2, zb);
    }
    for (let k = 0; k < 2; k++) seat(f, c0 + k, r + 1, 'sit', 0, -1, 2.2, STOOL_Y, stool());
  }

  // single chairs against the walls, facing into the room
  for (const [c, r, fx, fz] of [[0, 2, 1, 0], [19, 5, -1, 0], [13, 0, 0, 1], [6, 7, 0, -1]]) {
    const f = piece('chair', 'Chair', 'Sit down', [], SEAT_Y + 0.5 * K);
    seat(f, c, r, 'sit', fx, fz, -1.6, SEAT_Y, chair()); // pushed back against the wall
  }

  for (const f of list) tag(f.group, f.id); // (its parts were added after it was made)
  const key = (c, r) => c + ',' + r;
  const blocked = new Set(list.flatMap((f) => f.tiles.map(([c, r]) => key(c, r))));
  const seatTiles = new Set(seats.map((s) => key(s.col, s.row)));
  // where a piece stands (for the popup over it): the middle of its tiles, or of its seat
  const middle = (f) => { const pts = f.tiles.length ? f.tiles.map(([c, r]) => centre(c, r)) : f.seats.map((s) => [s.x, s.z]); return [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length]; };
  const targets = () => list.flatMap((f) => [f.group, ...f.parts]);
  const free = (f) => f.seats.filter((s) => s.by == null);
  // ---------- highlight: the piece you tapped glows warm and gets a gold outline on the floor round it ----------
  const HI = '#F2D16B';
  const hiMats = new Map(); // a material -> its glowing copy
  const glow = (m) => { if (!hiMats.has(m)) { const h = m.clone(); h.emissive.set(HI); h.emissiveIntensity = 0.3; hiMats.set(m, h); } return hiMats.get(m); };
  const outlineMat = new THREE.MeshBasicMaterial({ color: HI, transparent: true, opacity: 0.95, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const outline = new THREE.Mesh(new THREE.BufferGeometry(), outlineMat); outline.rotation.x = -Math.PI / 2; outline.position.y = 0.06; outline.renderOrder = 2; outline.visible = false; scene.add(outline);
  const bb = new THREE.Box3(), part = new THREE.Box3();
  let lit = null;
  function highlight(id) {
    const f = id == null ? null : list[id];
    if (f === lit) return;
    const meshes = (p) => { const out = []; for (const o of [p.group, ...p.parts]) o.traverse((m) => { if (m.isMesh) out.push(m); }); return out; };
    if (lit) for (const m of meshes(lit)) { if (m.userData.plain) { m.material = m.userData.plain; delete m.userData.plain; } }
    lit = f; outline.visible = !!f;
    if (!f) return;
    for (const m of meshes(f)) { m.userData.plain = m.material; m.material = glow(m.material); }
    // the outline: a rounded rectangle round everything the piece is made of (its table and its chairs)
    bb.makeEmpty(); for (const o of [f.group, ...f.parts]) { part.setFromObject(o); bb.union(part); }
    const pad = 0.5, w = 0.28, x0 = bb.min.x - pad, x1 = bb.max.x + pad, z0 = bb.min.z - pad, z1 = bb.max.z + pad;
    const rect = (a0, a1, b0, b1, r, path) => { path.moveTo(a0 + r, b0); path.lineTo(a1 - r, b0); path.quadraticCurveTo(a1, b0, a1, b0 + r); path.lineTo(a1, b1 - r); path.quadraticCurveTo(a1, b1, a1 - r, b1);
      path.lineTo(a0 + r, b1); path.quadraticCurveTo(a0, b1, a0, b1 - r); path.lineTo(a0, b0 + r); path.quadraticCurveTo(a0, b0, a0 + r, b0); return path; };
    // (the shape is drawn in x, -z: it is laid flat by turning it a quarter round x)
    const shape = rect(x0, x1, -z1, -z0, 0.9, new THREE.Shape()), hole = rect(x0 + w, x1 - w, -z1 + w, -z0 - w, 0.9 - w, new THREE.Path());
    shape.holes.push(hole);
    outline.geometry.dispose(); outline.geometry = new THREE.ShapeGeometry(shape, 8);
  }
  return { list, seats, blocked, seatTiles, targets, middle, free, key, highlight };
};

// ===== The people in the room: 20 NPCs and the 2 players' characters, all alike =====
// Characters(THREE, scene, board, match, avoid) stands 22 figures on tiles of the board (none on the tiles in avoid,
// a Set of 'col,row'). Each is No Mans Land's Flame Wizard
// body (src/models3d.js) without the hat, the beard and the staff: a robe and a head. Nothing about a player's figure
// tells it apart from the NPCs: the robe and skin colours, the tile and the facing are drawn from the match's random
// numbers the same way for everyone, and the two players' figures get random places in the list (so not even the ids
// give them away). Only the player's own view marks their figure (src/movement.js draws the circle under it).
// board: { cols, rows, tile }. The board is centred on the origin, x across it, z down it.
// Returns { list, height, players: [id of player 0's figure, id of player 1's], tileOf(x, z), centre(col, row) }.
// Each in list: { id, player (0, 1 or null for an NPC), col, row, robe, skin, group, base (its scale), seat (the seat it
// uses or is walking to, src/furniture.js), seated, pose (0 standing to 1 sitting) }. col / row is the tile it stands on
// (or is walking to: src/movement.js keeps them up to date).
const Characters = (THREE, scene, board, match, avoid = new Set()) => {
  const NPCS = 20, PLAYERS = 2, COUNT = NPCS + PLAYERS;
  const SCALE = 2.2; // about 4 m tall on a 6 m tile: bigger than NML's units, so people read on the wide board
  // robes: muted, distinct colours, so each person can be told apart from any view (more than there are people, so
  // which colours appear changes from match to match too)
  const ROBES = ['#B5523B', '#3E7CB1', '#D9A441', '#6B8F3A', '#8E5A9B', '#2F8F83', '#C9744A', '#5A6CB8', '#A63D5A', '#7F8A94',
    '#D27FA0', '#4F6D3A', '#C2B280', '#7A4A33', '#49A0C9', '#9C2F2F', '#E0C95A', '#355C6E', '#B48ACB', '#E4E0D4',
    '#3B3F46', '#E08A3C', '#78B8A0', '#6A3E7C', '#A9B84A', '#5C8FD6'];
  const SKINS = ['#F1C8A6', '#D9A27A', '#B57A52', '#8A5636', '#5E3A24'];
  // the Flame Wizard's body, as in NML: a 7-sided robe 1.5 m tall and a faceted head (an icosahedron) on top
  const robeGeo = new THREE.ConeGeometry(0.6, 1.5, 7); robeGeo.translate(0, 0.75, 0);
  const headGeo = new THREE.IcosahedronGeometry(0.25, 0); headGeo.translate(0, 1.6, 0);
  const mat = (hex) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.85, metalness: 0, flatShading: true });
  const skinMats = SKINS.map(mat);

  const rr = match.rng;
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rr() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const tiles = [];
  for (let r = 0; r < board.rows; r++) for (let c = 0; c < board.cols; c++) if (!avoid.has(c + ',' + r)) tiles.push([c, r]); // not on furniture or seats
  shuffle(tiles);
  const robes = shuffle(ROBES.slice());
  const playerIds = shuffle([...Array(COUNT).keys()]).slice(0, PLAYERS);

  const T = board.tile, BW = board.cols * T, BD = board.rows * T;
  const centre = (col, row) => [(col + 0.5) * T - BW / 2, (row + 0.5) * T - BD / 2];
  const tileOf = (x, z) => { const col = Math.floor((x + BW / 2) / T), row = Math.floor((z + BD / 2) / T); return col >= 0 && col < board.cols && row >= 0 && row < board.rows ? { col, row } : null; };
  const list = [];
  for (let i = 0; i < COUNT; i++) {
    const [col, row] = tiles[i], robe = robes[i], skin = Math.floor(rr() * SKINS.length), facing = rr() * Math.PI * 2;
    const g = new THREE.Group();
    const body = new THREE.Mesh(robeGeo, mat(robe)), head = new THREE.Mesh(headGeo, skinMats[skin]);
    for (const m of [body, head]) { m.castShadow = true; m.receiveShadow = true; m.userData.who = i; g.add(m); }
    const [x, z] = centre(col, row);
    g.position.set(x, 0, z);
    g.rotation.y = facing;
    g.scale.setScalar(SCALE);
    g.name = 'who:' + i;
    scene.add(g);
    const p = playerIds.indexOf(i);
    list.push({ id: i, player: p < 0 ? null : p, col, row, robe, skin: SKINS[skin], group: g, base: SCALE, seat: null, seated: false, pose: 0 });
  }
  return { list, height: 1.85 * SCALE, radius: 0.6 * SCALE, players: playerIds, tileOf, centre };
};

// ===== Pies: a grey plate with outlined slots that a character holds up, filled with wooden pieces =====
// Pies(THREE, scene, people, opts) gives every character (src/characters.js) a pie, hidden until shown. A pie floats
// above its owner's head (following them as they walk) and
// always faces the camera. It has n slots (3 to 8), filled clockwise from the top like a clock.
//
// Calls:
//   show(id) / hide(id)  pop the pie up over NPC id, or tuck it away
//   add(id)              drop the next wooden piece into its slot (shows the pie first if it was hidden; on a full
//                        pie, takes the pieces out again)
//   clear(id)            take all the pieces out
//   update(dt, camera)   once per drawn frame; busy() is true while anything is still moving
//   targets()            meshes to raycast against for picking, each with userData.who (the character's id)
// Events (for sound later): opts.onEvent(type, detail) and a window event 'agenda:pie' with { type, character, slot, n },
// type one of 'show', 'hide', 'drop' (a piece starts falling), 'snap' (it clicks into its slot), 'full', 'clear'.
//
// What makes the snap feel good, in order: the piece arrives fast and accelerating (no slow ease at the end), it sinks
// a hair too deep and springs back (the click), it squashes flat and rebounds, a short glint runs over its face, a few
// wood chips jump out of the joint, the plate takes the hit (dips, tilts away on that side, wobbles back), and the
// pieces already in the pie twitch outward from the impact like a ripple. Filling the last slot sends one wave round.
const Pies = (THREE, scene, people, opts = {}) => {
  const R = 2.5;          // the plate's radius (m): a little under a tile across
  const RIM = 0.14;       // width of the raised rim
  const HUB = 0.2;        // radius of the hub in the middle
  const DEPTH = 0.2;      // a piece's thickness (plus its bevels)
  const BEVEL = 0.04;
  const GAP = 0.05;       // space between neighbouring pieces (m)
  const REST_Z = BEVEL + 0.005; // a seated piece's back sits on the plate's floor (z = 0)
  const LIFT = 0.7;       // the pie's bottom edge hangs this far above the head
  const TILT = -0.32;     // the pie leans back from the camera a little, so its thickness shows
  const FLY = 0.3;        // seconds from a piece appearing to it hitting the slot
  const DROP_H = 1.5;     // how far in front of the plate it starts

  // ---------- materials ----------
  const std = (color, rough = 0.8) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0 });
  const floorMat = std('#73787E'), plateMat = std('#8D9297'), lineMat = std('#C4C8CC', 0.7);
  // the wood: a painted canvas of long grain lines, a few knots and pores; the same picture bumps the surface a little
  const wood = (() => {
    const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    let sd = 777; const rr = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; };
    const grd = g.createLinearGradient(0, 0, 0, S);
    grd.addColorStop(0, '#C99358'); grd.addColorStop(0.5, '#D6A367'); grd.addColorStop(1, '#C48C51');
    g.fillStyle = grd; g.fillRect(0, 0, S, S);
    // broad soft bands of lighter and darker wood
    for (let k = 0; k < 14; k++) {
      const y = rr() * S, h = 8 + rr() * 30;
      g.globalAlpha = 0.12 + rr() * 0.12; g.fillStyle = rr() < 0.5 ? '#A86F3A' : '#E4B579';
      g.beginPath(); for (let x = 0; x <= S; x += 8) { const yy = y + Math.sin(x * 0.012 + k) * 10; x ? g.lineTo(x, yy) : g.moveTo(x, yy); }
      for (let x = S; x >= 0; x -= 8) g.lineTo(x, y + h + Math.sin(x * 0.012 + k) * 10);
      g.fill();
    }
    // the grain: long, gently wavy lines, darker and lighter
    for (let k = 0; k < 120; k++) {
      const y = rr() * S, a = 2 + rr() * 6, f = 0.004 + rr() * 0.01, ph = rr() * 6, a2 = rr() * 2;
      g.globalAlpha = 0.18 + rr() * 0.35; g.strokeStyle = rr() < 0.75 ? '#8E5A2B' : '#EBC28A'; g.lineWidth = 0.6 + rr() * 2;
      g.beginPath(); for (let x = -4; x <= S + 4; x += 6) { const yy = y + Math.sin(x * f + ph) * a + Math.sin(x * 0.08 + ph) * a2; x > -4 ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke();
    }
    // two knots, with grain rings round them
    for (let n = 0; n < 2; n++) {
      const x = 80 + rr() * (S - 160), y = 80 + rr() * (S - 160);
      for (let r = 4; r < 34; r += 3.5) { g.globalAlpha = 0.35 - r / 120; g.strokeStyle = '#7A4A22'; g.lineWidth = 1.4; g.beginPath(); g.ellipse(x, y, r * 2.4, r * 0.9, 0, 0, Math.PI * 2); g.stroke(); }
      g.globalAlpha = 0.7; g.fillStyle = '#5E3818'; g.beginPath(); g.ellipse(x, y, 7, 3.5, 0, 0, Math.PI * 2); g.fill();
    }
    // pores: tiny dark flecks along the grain
    for (let k = 0; k < 1400; k++) { g.globalAlpha = 0.2 + rr() * 0.2; g.fillStyle = '#6E431F'; g.fillRect(rr() * S, rr() * S, 1 + rr() * 3, 0.8); }
    g.globalAlpha = 1;
    return c;
  })();
  const woodTex = new THREE.CanvasTexture(wood);
  woodTex.colorSpace = THREE.SRGBColorSpace; woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.anisotropy = 8;
  const bumpTex = new THREE.CanvasTexture(wood); bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
  // each piece: the grain turned to run out from the middle along it, and a slightly different wood tone
  const TONES = ['#FFFFFF', '#F4E6D6', '#FFF3E2', '#EADBC8', '#FFF8EE', '#F0DCC2'];
  function woodMat(angle, k) {
    const map = woodTex.clone(), bump = bumpTex.clone();
    for (const t of [map, bump]) { t.repeat.set(0.55, 0.55); t.rotation = -angle; t.offset.set(k * 0.37, k * 0.21); t.needsUpdate = true; }
    return new THREE.MeshStandardMaterial({ map, bumpMap: bump, bumpScale: 0.9, color: TONES[k % TONES.length], roughness: 0.55, metalness: 0 });
  }
  const chipMats = [std('#B98049', 0.6), std('#D9A86C', 0.6), std('#8E5A2B', 0.6)];
  const chipGeo = new THREE.BoxGeometry(1, 1, 1);

  // ---------- geometry ----------
  // the plate: a dark floor, a raised rim and hub, and a spoke between every two slots (the outlines of the empty spots)
  const floorGeo = new THREE.CylinderGeometry(R, R, 0.22, 64); floorGeo.rotateX(Math.PI / 2); floorGeo.translate(0, 0, -0.11);
  const rimShape = new THREE.Shape(); rimShape.absarc(0, 0, R, 0, Math.PI * 2, false);
  const rimHole = new THREE.Path(); rimHole.absarc(0, 0, R - RIM, 0, Math.PI * 2, true); rimShape.holes.push(rimHole);
  const rimGeo = new THREE.ExtrudeGeometry(rimShape, { depth: 0.14, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.025, bevelSegments: 2, curveSegments: 64 });
  const hubGeo = new THREE.CylinderGeometry(HUB, HUB, 0.2, 24); hubGeo.rotateX(Math.PI / 2); hubGeo.translate(0, 0, 0.08);
  const backGeo = new THREE.CylinderGeometry(R * 0.98, R * 0.98, 0.04, 64); backGeo.rotateX(Math.PI / 2); backGeo.translate(0, 0, -0.24);
  // slot k runs clockwise from the top: from angle a0 down to a1
  const slotAngles = (n, k) => { const w = Math.PI * 2 / n, a0 = Math.PI / 2 - k * w; return [a0, a0 - w, a0 - w / 2]; };
  const r0 = HUB + 0.06 + BEVEL, r1 = R - RIM - 0.05 - BEVEL;
  // a wedge filling one slot, with gaps to its neighbours and rounded (bevelled) edges, centred on its own centroid
  // (so it squashes and turns about its middle); returns { geo, cx, cy }
  function wedge(n, k) {
    const [a0, a1, m] = slotAngles(n, k);
    const g0 = (GAP / 2 + BEVEL) / r0, g1 = (GAP / 2 + BEVEL) / r1; // the gap, as an angle at each end
    const s = new THREE.Shape();
    s.moveTo(r0 * Math.cos(a1 + g0), r0 * Math.sin(a1 + g0));
    s.lineTo(r1 * Math.cos(a1 + g1), r1 * Math.sin(a1 + g1));
    s.absarc(0, 0, r1, a1 + g1, a0 - g1, false);
    s.lineTo(r0 * Math.cos(a0 - g0), r0 * Math.sin(a0 - g0));
    s.absarc(0, 0, r0, a0 - g0, a1 + g0, true);
    const geo = new THREE.ExtrudeGeometry(s, { depth: DEPTH, bevelEnabled: true, bevelThickness: BEVEL, bevelSize: BEVEL, bevelSegments: 3, curveSegments: 20 });
    const th = a0 - a1, cr = (2 / 3) * (r1 ** 3 - r0 ** 3) / (r1 ** 2 - r0 ** 2) * Math.sin(th / 2) / (th / 2);
    const cx = cr * Math.cos(m), cy = cr * Math.sin(m);
    geo.translate(-cx, -cy, 0);
    // the glint over its face: the same outline, flat
    const flat = new THREE.ShapeGeometry(s, 20); flat.translate(-cx, -cy, DEPTH + BEVEL + 0.01);
    return { geo, flat, cx, cy, m };
  }

  // ---------- springs (a value pulled back to 0, overshooting a little) ----------
  const spring = (k, zeta) => ({ x: 0, v: 0, k, c: 2 * Math.sqrt(k) * zeta });
  function step(s, dt) { const n = Math.ceil(dt / (1 / 240)), h = dt / n; for (let i = 0; i < n; i++) { s.v += (-s.k * s.x - s.c * s.v) * h; s.x += s.v * h; } }
  const resting = (s) => Math.abs(s.x) < 1e-4 && Math.abs(s.v) < 1e-3;

  const ease = { outBack: (u) => 1 + 2.4 * (u - 1) ** 3 + 1.4 * (u - 1) ** 2, outCubic: (u) => 1 - (1 - u) ** 3, inCubic: (u) => u * u * u };
  const emit = (type, pie, slot) => {
    const detail = { type, character: pie.id, slot, n: pie.n };
    if (opts.onEvent) opts.onEvent(type, detail);
    window.dispatchEvent(new CustomEvent('agenda:pie', { detail }));
  };

  // ---------- one pie per NPC ----------
  const tiltQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), TILT);
  const pies = people.list.map((who) => {
    const n = [6, 4, 5, 8, 3, 6, 7, 4][who.id % 8];
    const holder = new THREE.Group(), pop = new THREE.Group(), inner = new THREE.Group();
    holder.add(pop); pop.add(inner);
    holder.position.copy(who.group.position); holder.position.y = people.height + LIFT + R;
    holder.visible = false; holder.name = 'pie:' + who.id;
    const part = (geo, mat) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; m.userData.who = who.id; inner.add(m); return m; };
    part(floorGeo, floorMat); part(rimGeo, lineMat); part(hubGeo, lineMat); part(backGeo, plateMat);
    for (let k = 0; k < n; k++) { // the spokes: thin raised ridges between the slots
      const a = slotAngles(n, k)[0], len = R - RIM - HUB, sp = part(new THREE.BoxGeometry(len, 0.05, 0.12), lineMat);
      sp.position.set(Math.cos(a) * (HUB + len / 2), Math.sin(a) * (HUB + len / 2), 0.06); sp.rotation.z = a;
    }
    const pieces = [];
    for (let k = 0; k < n; k++) {
      const w = wedge(n, k), mesh = new THREE.Mesh(w.geo, woodMat(w.m, who.id * 3 + k));
      mesh.castShadow = true; mesh.receiveShadow = true; mesh.visible = false; mesh.userData.who = who.id;
      const glint = new THREE.Mesh(w.flat, new THREE.MeshBasicMaterial({ color: '#FFF6E0', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
      glint.userData.who = who.id; mesh.add(glint);
      inner.add(mesh);
      pieces.push({ k, mesh, glint, cx: w.cx, cy: w.cy, m: w.m, state: 'empty', t: 0, z: spring(1500, 0.2), sq: spring(1100, 0.18), bump: null, flash: 0 });
    }
    scene.add(holder);
    return { id: who.id, owner: who.group, n, holder, pop, inner, pieces, filled: 0, shown: false, popT: 1, popDir: 0,
      s: spring(240, 0.26), tx: spring(200, 0.24), ty: spring(200, 0.24), chips: [], finale: -1, off: [0, 0], offNow: [0, 0] };
  });

  // ---------- the moves ----------
  function show(id) { const p = pies[id]; if (!p || p.shown) return; p.shown = true; p.holder.visible = true; p.popDir = 1; p.popT = 0; emit('show', p); }
  function hide(id) { const p = pies[id]; if (!p || !p.shown) return; p.shown = false; p.popDir = -1; p.popT = 0; emit('hide', p); }
  function add(id) {
    const p = pies[id]; if (!p) return;
    if (!p.shown) { show(id); return; }
    if (p.filled >= p.n) { clear(id); return; }
    const pc = p.pieces[p.filled++];
    pc.state = 'fly'; pc.t = 0; pc.mesh.visible = true; pc.bump = null;
    emit('drop', p, pc.k);
  }
  function clear(id) {
    const p = pies[id]; if (!p) return;
    p.pieces.forEach((pc, i) => { if (pc.state === 'empty') return; pc.state = 'out'; pc.t = -0.035 * (p.filled - 1 - i); });
    p.filled = 0; p.finale = -1;
    emit('clear', p);
  }

  // the impact of piece pc in pie p
  function snap(p, pc) {
    pc.state = 'seated';
    pc.z.x = -0.07; pc.z.v = 0;         // sunk a hair too deep: springs back up (the click)
    pc.sq.x = -0.3; pc.sq.v = 0;        // squashed flat: rebounds
    pc.flash = 1;                       // the glint
    const dx = Math.cos(pc.m), dy = Math.sin(pc.m);
    p.s.v -= 1.6;                       // the plate dips...
    p.tx.v += -dy * 1.5; p.ty.v += dx * 1.5; // ...and tilts away on the side that was hit
    // the pieces already in: a ripple running round from the impact
    for (const o of p.pieces) {
      if (o === pc || o.state !== 'seated') continue;
      const d = Math.min(Math.abs(o.k - pc.k), p.n - Math.abs(o.k - pc.k));
      o.bump = { t: -0.03 * d, h: 0.07 / d };
    }
    // wood chips out of the joint: from the outer edge and the two sides
    for (let i = 0; i < 7; i++) {
      const side = i % 3, w = Math.PI * 2 / p.n, a = pc.m + (side === 0 ? (Math.random() - 0.5) * w * 0.8 : (side === 1 ? 0.5 : -0.5) * w);
      const r = side === 0 ? r1 + 0.05 : r0 + Math.random() * (r1 - r0);
      const c = new THREE.Mesh(chipGeo, chipMats[i % 3]), s = 0.08 + Math.random() * 0.08;
      c.scale.set(s, s * 0.6, s * 0.4);
      c.position.set(Math.cos(a) * r, Math.sin(a) * r, REST_Z + DEPTH);
      const out = side === 0 ? 1 : 0.4, tg = side === 0 ? 0 : (side === 1 ? 1 : -1);
      const vx = Math.cos(pc.m) * out * 2.2 + -Math.sin(a) * tg * 1.6, vy = Math.sin(pc.m) * out * 2.2 + Math.cos(a) * tg * 1.6;
      c.userData.chip = { v: new THREE.Vector3(vx + (Math.random() - 0.5), vy + (Math.random() - 0.5) + 1.2, 1.5 + Math.random() * 1.5), spin: new THREE.Vector3(Math.random() * 20, Math.random() * 20, Math.random() * 20), life: 0, s };
      p.inner.add(c); p.chips.push(c);
    }
    emit('snap', p, pc.k);
    if (p.filled === p.n && p.pieces.every((o) => o.state === 'seated')) { p.finale = 0.14; emit('full', p); }
  }

  const tangent = new THREE.Vector3(), qa = new THREE.Quaternion(), qb = new THREE.Quaternion(), zAxis = new THREE.Vector3(0, 0, 1);
  function update(dt, camera) {
    for (const p of pies) {
      if (!p.holder.visible) continue;
      p.holder.quaternion.copy(camera.quaternion).multiply(tiltQ);
      // over its owner's head, pushed out by its offset (so the pies of people standing close don't pile up), easing there
      for (const k of [0, 1]) { const d = p.off[k] - p.offNow[k]; p.offNow[k] = Math.abs(d) < 0.01 ? p.off[k] : p.offNow[k] + d * Math.min(1, dt * 6); }
      p.holder.position.x = p.owner.position.x + p.offNow[0]; p.holder.position.z = p.owner.position.z + p.offNow[1];
      // popping up (or away)
      if (p.popDir) {
        p.popT = Math.min(1, p.popT + dt / (p.popDir > 0 ? 0.38 : 0.22));
        const e = p.popDir > 0 ? ease.outBack(p.popT) : 1 - ease.inCubic(p.popT);
        p.pop.scale.setScalar(Math.max(0.001, e)); p.pop.rotation.z = (1 - e) * 0.5; p.pop.position.y = (1 - e) * -R * 0.6;
        if (p.popT >= 1) { if (p.popDir < 0) p.holder.visible = false; p.popDir = 0; }
      }
      // the plate's own springs
      for (const s of [p.s, p.tx, p.ty]) step(s, dt);
      p.inner.scale.setScalar(1 + p.s.x * 0.12);
      p.inner.rotation.set(p.tx.x * 0.25, p.ty.x * 0.25, 0);
      // the full pie: one wave round, then a pop
      if (p.finale >= 0) {
        p.finale -= dt;
        if (p.finale < 0) { p.pieces.forEach((o, i) => { o.bump = { t: -0.045 * i, h: 0.13 }; }); p.s.v += 2.4; p.finale = -1; }
      }
      // the pieces
      for (const pc of p.pieces) {
        const mesh = pc.mesh;
        if (pc.state === 'empty') continue;
        let z = REST_Z, off = 0, twist = 0, tilt = 0, sc = 1, sz = 1;
        if (pc.state === 'fly') {
          pc.t += dt;
          const u = Math.min(1, pc.t / FLY), back = (1 - u) * (1 - u);
          z += DROP_H * (1 - u * u);        // accelerating in: fastest at the moment it lands
          off = 0.55 * back; twist = 0.75 * back; tilt = 0.55 * back;
          sc = 0.55 + 0.45 * ease.outCubic(Math.min(1, u * 1.7));
          if (u >= 1) snap(p, pc);
        } else if (pc.state === 'out') {
          pc.t += dt;
          const u = Math.max(0, Math.min(1, pc.t / 0.22));
          z += 0.9 * ease.outCubic(u); sc = Math.max(0.001, 1 - ease.inCubic(u)); twist = -0.6 * u;
          if (u >= 1) { pc.state = 'empty'; mesh.visible = false; continue; }
        }
        if (pc.state === 'seated') {
          step(pc.z, dt); step(pc.sq, dt);
          z += pc.z.x; sz = 1 + pc.sq.x; sc = 1 - pc.sq.x * 0.3;

        mesh.quaternion.copy(qa.setFromAxisAngle(zAxis, twist)).multiply(qb.setFromAxisAngle(tangent, -tilt));
        mesh.scale.set(sc, sc, sc * sz);

        if (pc.flash > 0) { pc.flash = Math.max(0, pc.flash - dt / 0.26); pc.glint.material.opacity = 0.55 * pc.flash ** 2; }
      }
      // the chips: thrown out, falling (down on the screen), spinning, shrinking away
      for (let i = p.chips.length - 1; i >= 0; i--) {
        const c = p.chips[i], d = c.userData.chip;
        d.life += dt; d.v.y -= 14 * dt; d.v.multiplyScalar(1 - 1.5 * dt);
        c.position.addScaledVector(d.v, dt);
        c.rotation.x += d.spin.x * dt; c.rotation.y += d.spin.y * dt; c.rotation.z += d.spin.z * dt;
        const k = Math.max(0, 1 - Math.max(0, d.life - 0.25) / 0.25);
        c.scale.set(d.s * k, d.s * 0.6 * k, d.s * 0.4 * k);

    || p.pieces.some((pc) => pc.state === 'fly' || pc.state === 'out' || pc.bump || pc.flash > 0 || (pc.state === 'seated' && !(resting(pc.z) && resting(pc.sq))))));
